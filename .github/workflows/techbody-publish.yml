name: TechBody IG Publisher

on:
  # schedule:
  #   - cron: "*/30 * * * *"   # DESATIVADO 25-jun-2026 — publicações acidentais
  #   Reativar requer PUBLISH_ENABLED=true nos Secrets + autorização do user
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (1 = só mostra plano)"
        default: "1"
      publish_only:
        description: "IDs específicos (vírgula-separados). Vazio = todos os due."
        default: ""
        required: false

concurrency:
  group: techbody-publish
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # passo "Abrir issue" usa o github.token para criar a issue de geração

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets
        id: gate
        env:
          TB: ${{ secrets.IG_TOKEN_TECHBODY }}
          TBU: ${{ secrets.IG_TOKEN_TECHBODY_U }}
        run: |
          if [ -z "$TB" ] && [ -z "$TBU" ]; then
            echo "Sem tokens configurados — salto." && echo "run=0" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar conteúdo aprovado due
        if: steps.gate.outputs.run == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IG_TOKEN_TECHBODY: ${{ secrets.IG_TOKEN_TECHBODY }}
          IG_USER_ID_TECHBODY: ${{ secrets.IG_USER_ID_TECHBODY }}
          IG_TOKEN_TECHBODY_U: ${{ secrets.IG_TOKEN_TECHBODY_U }}
          IG_USER_ID_TECHBODY_U: ${{ secrets.IG_USER_ID_TECHBODY_U }}
          IG_TOKEN_LUIZ_SANTANA: ${{ secrets.IG_TOKEN_LUIZ_SANTANA }}
          IG_USER_ID_LUIZ_SANTANA: ${{ secrets.IG_USER_ID_LUIZ_SANTANA }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PUBLISH_ENABLED: ${{ secrets.PUBLISH_ENABLED }}
          PUBLISH_ONLY: ${{ github.event.inputs.publish_only || '' }}
        run: python3 -u scripts/techbody_publisher.py

      - name: Alertar falhas (issue deduped + email)
        if: always() && steps.gate.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 -u scripts/publish_alerts.py

      - name: Verificar meses 100% aprovados
        id: gen
        if: steps.gate.outputs.run == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -u scripts/check_month_complete.py

      - name: Abrir issue a pedir geração do mês seguinte
        if: steps.gen.outputs.gen_needed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.gen.outputs.gen_summary }}
        run: |
          TITLE="Gerar conteúdo do mês seguinte"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq length)
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf 'Deteção automática: %s\n\nCorrer a geração via content-machine (copy-first, leis de marca TB/TBU/Luiz, standard r03) e carregar os novos items na página de aprovação.' "$SUMMARY")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          else
            echo "Issue já aberta — não duplico."
          fi
