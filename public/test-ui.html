<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Test UI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono','Trillium Web',system-ui,monospace;background:#f5f3ef;color:#1a1a1a;padding:24px;max-width:1200px;margin:0 auto}
h1{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
.sub{color:#666;font-size:13px;margin-bottom:24px}
.header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.progress-group{display:flex;gap:24px;flex-wrap:wrap}
.progress-bar{display:flex;flex-direction:column;gap:4px}
.progress-bar__label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#555}
.progress-bar__track{width:160px;height:6px;background:#ddd;border-radius:3px;overflow:hidden}
.progress-bar__fill{height:100%;border-radius:3px;transition:width .3s}
.progress-bar__fill--approved{background:#2bb05f}
.progress-bar__stats{font-size:11px;color:#888}
.search-bar{width:100%;padding:10px 14px;font-size:14px;border:2px solid #ccc;border-radius:8px;font-family:inherit;margin-bottom:20px;transition:border .2s}
.search-bar:focus{border-color:#1a1a1a;outline:none}
.timeline-day{margin-bottom:20px}
.timeline-day__head{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-left:4px}
.timeline-day__date{font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;min-width:90px}
.timeline-day__line{flex:1;height:1px;background:#ddd}
.card{background:#fff;border:2px solid #1a1a1a;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s;box-shadow:3px 3px 0 0 #1a1a1a}
.card:hover{box-shadow:5px 5px 0 0 #1a1a1a}
.card__thumb{width:56px;height:70px;border-radius:4px;background:#eee;overflow:hidden;flex-shrink:0;border:1px solid #ddd}
.card__thumb img{width:100%;height:100%;object-fit:cover}
.card__body{flex:1;min-width:0}
.card__title{font-size:14px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__meta{display:flex;gap:8px;margin-top:4px;align-items:center;flex-wrap:wrap}
.card__tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid}
.card__tag--carrossel{background:#e8f4ff;border-color:#b3d4f0;color:#1a5a9a}
.card__tag--reel{background:#fce8f0;border-color:#f0b3c8;color:#9a1a4a}
.card__tag--story{background:#f0f0f0;border-color:#ccc;color:#666}
.card__tag--cta-ok{background:#e6f7ee;border-color:#a0d9b8;color:#1a7a4a}
.card__tag--cta-warn{background:#fff3e0;border-color:#f0c080;color:#a06020}
.card__tag--cta-bad{background:#ffe8e8;border-color:#f0a0a0;color:#a02020}
.card__status{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex-shrink:0;cursor:pointer;border:2px solid;transition:.15s;user-select:none}
.card__status--pending{border-color:#ccc;color:#999}
.card__status--pending:hover{border-color:#2bb05f;color:#2bb05f;background:#e6f7ee}
.card__status--approved{border-color:#2bb05f;color:#2bb05f;background:#e6f7ee}
.card__status--approved:hover{border-color:#ff4d2e;color:#ff4d2e;background:#ffe8e8}
.card__status--rejected{border-color:#ff4d2e;color:#ff4d2e;background:#ffe8e8}
.card__status--rejected:hover{border-color:#999;color:#999;background:#f5f5f5}
.card__status--published{border-color:#f5a623;color:#f5a623;background:#fff8e8}
.empty{text-align:center;padding:60px 20px;color:#999;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:14px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast__undo{font-weight:700;color:#f5a623;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.toast--hide{opacity:0;transform:translateX(-50%) translateY(20px);transition:.3s}
</style>
</head>
<body>
<h1>Review · Content</h1>
<p class="sub" id="sub">A carregar…</p>
<div class="header">
  <div class="progress-group" id="progressGroup"></div>
  <label style="font-size:12px;color:#888"><input type="checkbox" id="hideRejected" checked> Ocultar rejeitados</label>
</div>
<input type="text" class="search-bar" id="search" placeholder="Pesquisar por texto, tema ou ID…">
<div id="timeline"></div>
<div id="empty" class="empty" hidden>Nenhum item encontrado.</div>

<script>
let allItems = [], approvals = {};
async function load(){
  try{
    const r=await fetch('/aprovacao-tb-202605/data/items.json?_='+Date.now());
    allItems=(await r.json()).filter(i=>i.month==='2026-07');
    try{approvals=JSON.parse(localStorage.getItem('test-approvals-v1')||'{}')}catch{}
    render()
  }catch(e){document.getElementById('sub').textContent='Erro a carregar dados.'}
}
const BL={techbody:'TB',techbody_u:'TBU',luiz_santana:'Luiz'},BC={techbody:'#1a5a9a',techbody_u:'#b06d35',luiz_santana:'#333'};
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
function cta(it){
  const s=(it.slides_text||[]).slice(-1)[0];const l=((s?.text_overlay||s?.text||'')).toLowerCase();
  if(l.includes('sessao experimental')&&it.brand==='techbody_u')return{t:'X sessao exp.',c:'cta-bad'};
  if(l.includes('link na bio'))return{t:'Link bio',c:'cta-ok'};
  if(l.includes('mensagem'))return{t:'Mensagem',c:'cta-ok'};
  if(l.includes('sessao experimental'))return{t:'sessao exp.',c:'cta-warn'};
  return null;
}
function st(it){
  if(it.status==='published')return'published';
  const a=approvals[it.id];
  if(a==='approved')return'approved';if(a==='rejected')return'rejected';
  const s=it._status||it.status;if(s==='approved'||s==='rejected')return s;
  return'pending';
}
function toggle(it){
  const cur=st(it),id=it.id;
  let next=cur==='pending'||cur==='published'?'approved':cur==='approved'?'rejected':'pending';
  approvals[id]=next==='pending'?undefined:next;
  localStorage.setItem('test-approvals-v1',JSON.stringify(approvals));
  toast(next,()=>{approvals[id]=cur==='pending'?undefined:cur;localStorage.setItem('test-approvals-v1',JSON.stringify(approvals));render()});
  render();
}
function toast(action,undo){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`${action==='approved'?'Aprovado':action==='rejected'?'Rejeitado':'Pendente'} <span class="toast__undo">Desfazer</span>`;
  document.body.appendChild(t);
  t.querySelector('.toast__undo').onclick=()=>{undo();t.classList.add('toast--hide');setTimeout(()=>t.remove(),300)};
  setTimeout(()=>{t.classList.add('toast--hide');setTimeout(()=>t.remove(),300)},3000);
}
function fil(items){
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(document.getElementById('hideRejected').checked)items=items.filter(i=>st(i)!=='rejected');
  if(!q)return items;
  return items.filter(i=>(i.title||i.theme||'').toLowerCase().includes(q)||i.id.toLowerCase().includes(q)||(i.slides_text||[]).some(s=>(s.text_overlay||s.text||'').toLowerCase().includes(q)));
}
function render(){
  const items=fil(allItems);
  document.getElementById('sub').textContent=items.length+' de '+allItems.length+' items';
  const br={};for(const i of allItems){if(!br[i.brand])br[i.brand]={t:0,a:0};br[i.brand].t++;if(st(i)==='approved')br[i.brand].a++}
  document.getElementById('progressGroup').innerHTML=Object.entries(br).map(([b,d])=>'<div class="progress-bar"><span class="progress-bar__label">'+(BL[b]||b)+'</span><div class="progress-bar__track"><div class="progress-bar__fill progress-bar__fill--approved" style="width:'+Math.round((d.a/d.t)*100)+'%;background:'+(BC[b]||'#333')+'"></div></div><span class="progress-bar__stats">'+d.a+'/'+d.t+'</span></div>').join('');
  const byDay={};for(const i of items){const d=i.scheduled_for||'sem_data';if(!byDay[d])byDay[d]=[];byDay[d].push(i)}
  const days=Object.keys(byDay).sort((a,b)=>a==='sem_data'?1:b==='sem_data'?-1:a.localeCompare(b));
  document.getElementById('empty').hidden=days.length>0;
  if(!days.length){document.getElementById('timeline').innerHTML='';return}
  document.getElementById('timeline').innerHTML=days.map(d=>{const sh=d!=='sem_data';let lb='',wd='';if(sh){const dd=new Date(d+'T12:00:00');lb=dd.toLocaleDateString('pt-PT',{day:'numeric',month:'short'});wd=WD[dd.getDay()]}
  return '<div class="timeline-day">'+(sh?'<div class="timeline-day__head"><span class="timeline-day__date">'+lb+' . '+wd+'</span><span class="timeline-day__line"></span></div>':'')+byDay[d].map(i=>{const s=st(i),ct=cta(i);const sb=(i.html_url||'').replace(/\.html$/,'');const th=i.format==='carrossel'&&sb?sb+'_shots/slide_01.jpg':sb?sb+'.jpg':'';const ic={pending:'...',approved:'v',rejected:'x',published:'!'}
  return '<div class="card" data-id="'+i.id+'"><div class="card__thumb">'+(th?'<img src="'+th+'?v=t" alt="" loading="lazy">':'')+'</div><div class="card__body"><div class="card__title">'+(i.title||i.theme||i.id)+'</div><div class="card__meta"><span class="card__tag card__tag--'+i.format+'">'+i.format+'</span><span style="font-size:10px;color:#888;font-weight:600">'+(BL[i.brand]||i.brand)+'</span>'+(ct?'<span class="card__tag card__tag--'+ct.c+'">'+ct.t+'</span>':'')+'</div></div><div class="card__status card__status--'+s+'" data-action="toggle">'+(ic[s]||'...')+'</div></div>'
}).join('')+'</div>'}).join('');
  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{el.onclick=e=>{e.stopPropagation();const item=allItems.find(i=>i.id===el.closest('.card').dataset.id);if(item)toggle(item)}});
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('hideRejected').addEventListener('change',render);
load();
</script>
</body>
</html>
