<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>O site bonito que não vende</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #050505;
    --accent: #FF2A2A;
    --dot: rgba(5,5,5,0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
    position: relative;
  }
  /* .reel is absolutely positioned and centered via negative margins. JS sets
     transform: scale() to fit viewport while preserving its natural 1080x1920.
     At native 1080×1920 viewport (Playwright recording), scale is 1.0. */
  .reel {
    position: absolute;
    top: 50%; left: 50%;
    margin-top: -960px;
    margin-left: -540px;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1.8px, transparent 1.8px);
    background-size: 44px 44px;
    overflow: hidden;
    transform-origin: center center;
    animation: bg-drift 6s linear infinite;
  }
  @keyframes bg-drift {
    0%   { background-position: 0 0; }
    100% { background-position: 44px 44px; }
  }
  /* Scene sweep — a red bar that slides across at each scene transition. */
  .sweep {
    position: absolute;
    top: 0; left: 0;
    height: 12px;
    width: 100%;
    background: var(--accent);
    z-index: 3;
    transform-origin: left center;
    transform: scaleX(0);
    pointer-events: none;
  }
  .reel::before {
    content: "";
    position: absolute;
    inset: 60px;
    border: 6px solid var(--ink);
    pointer-events: none;
    z-index: 1;
  }
  .brand {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: var(--ink);
    color: #FFF;
    padding: 14px 28px;
    border: 4px solid var(--ink);
    font: 900 32px/1 'Arial Black', sans-serif;
    letter-spacing: -0.02em;
    text-transform: lowercase;
  }
  .progress {
    position: absolute;
    top: 60px; left: 60px; right: 60px; height: 8px;
    background: rgba(5,5,5,0.08);
    z-index: 4;
  }
  .progress::after {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent);
    transform-origin: left center;
    animation: progress 28.00s linear infinite;
  }
  @keyframes progress {
    0%   { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }
  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 110px;
    z-index: 2;
  }
  .scene {
    position: absolute;
    inset: 220px 110px 280px;
    display: grid;
    place-items: center;
    opacity: 0;
  }
  .scene__text {
    font: 900 108px/1.06 'Arial Black', sans-serif;
    color: var(--ink);
    letter-spacing: -0.035em;
    text-transform: uppercase;
    text-align: center;
    max-width: 820px;
    /* No word-break / overflow-wrap / hyphens: keep words intact. JS shrinks
       font until the longest word fits without splitting. */
    word-break: normal;
    overflow-wrap: normal;
    hyphens: manual;
  }
  .scene--hook .scene__text { font-size: 118px; }
  .scene--cta .scene__text { font-size: 102px; }
  .hl {
    display: inline-block;
    background: var(--accent);
    color: #FFF;
    padding: 4px 22px 14px;
    border: 6px solid var(--ink);
    box-shadow: 10px 10px 0 0 var(--ink);
    margin: 6px 4px;
    transform: rotate(-1.4deg);
  }
  .footer-arrow {
    position: absolute;
    bottom: 96px; left: 50%; transform: translateX(-50%);
    z-index: 4;
    font: 900 88px/1 'Arial Black', sans-serif;
    color: var(--accent);
    animation: arrow 1.8s ease-in-out infinite;
  }
  @keyframes arrow {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 14px); }
  }
  @keyframes scene1 {
  0%, 0.00% { opacity: 0; transform: translateY(14px); }
  3.00% { opacity: 1; transform: translateY(0); }
  13.00% { opacity: 1; transform: translateY(0); }
  16.67%, 100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes sweep1 {
  0%, 0.00% { transform: scaleX(0); opacity: 1; }
  0.67% { transform: scaleX(1); opacity: 1; }
  1.67% { transform: scaleX(1); opacity: 0; }
  1.83%, 100% { transform: scaleX(0); opacity: 0; }
}
@keyframes scene2 {
  0%, 16.67% { opacity: 0; transform: translateY(14px); }
  19.67% { opacity: 1; transform: translateY(0); }
  29.67% { opacity: 1; transform: translateY(0); }
  33.33%, 100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes sweep2 {
  0%, 16.67% { transform: scaleX(0); opacity: 1; }
  17.33% { transform: scaleX(1); opacity: 1; }
  18.33% { transform: scaleX(1); opacity: 0; }
  18.50%, 100% { transform: scaleX(0); opacity: 0; }
}
@keyframes scene3 {
  0%, 33.33% { opacity: 0; transform: translateY(14px); }
  36.33% { opacity: 1; transform: translateY(0); }
  46.33% { opacity: 1; transform: translateY(0); }
  50.00%, 100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes sweep3 {
  0%, 33.33% { transform: scaleX(0); opacity: 1; }
  34.00% { transform: scaleX(1); opacity: 1; }
  35.00% { transform: scaleX(1); opacity: 0; }
  35.17%, 100% { transform: scaleX(0); opacity: 0; }
}
@keyframes scene4 {
  0%, 50.00% { opacity: 0; transform: translateY(14px); }
  53.00% { opacity: 1; transform: translateY(0); }
  63.00% { opacity: 1; transform: translateY(0); }
  66.67%, 100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes sweep4 {
  0%, 50.00% { transform: scaleX(0); opacity: 1; }
  50.67% { transform: scaleX(1); opacity: 1; }
  51.67% { transform: scaleX(1); opacity: 0; }
  51.83%, 100% { transform: scaleX(0); opacity: 0; }
}
@keyframes scene5 {
  0%, 66.67% { opacity: 0; transform: translateY(14px); }
  69.67% { opacity: 1; transform: translateY(0); }
  79.67% { opacity: 1; transform: translateY(0); }
  83.33%, 100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes sweep5 {
  0%, 66.67% { transform: scaleX(0); opacity: 1; }
  67.33% { transform: scaleX(1); opacity: 1; }
  68.33% { transform: scaleX(1); opacity: 0; }
  68.50%, 100% { transform: scaleX(0); opacity: 0; }
}
@keyframes scene6 {
  0%, 83.33% { opacity: 0; transform: translateY(14px); }
  86.33% { opacity: 1; transform: translateY(0); }
  96.33% { opacity: 1; transform: translateY(0); }
  100.00%, 100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes sweep6 {
  0%, 83.33% { transform: scaleX(0); opacity: 1; }
  84.00% { transform: scaleX(1); opacity: 1; }
  85.00% { transform: scaleX(1); opacity: 0; }
  85.17%, 100% { transform: scaleX(0); opacity: 0; }
}
</style>
</head>
<body>
<section class="reel" aria-label="O site bonito que não vende">
  <div class="progress"></div>
  <div class="brand">Pontofinal.site_</div>
  <div class="stage">
  <div class="scene scene--hook" style="animation: scene1 28.00s linear infinite;"><p class="scene__text">Não me venham com sites <span class="hl">bonitos</span></p></div>
  <div class="scene scene--setup" style="animation: scene2 28.00s linear infinite;"><p class="scene__text">Tive um cliente que pagou <span class="hl">cinco mil euros</span> num site premiado</p></div>
  <div class="scene scene--setup" style="animation: scene3 28.00s linear infinite;"><p class="scene__text">Vendeu <span class="hl">zero</span>. Nada. Em três meses</p></div>
  <div class="scene scene--punch" style="animation: scene4 28.00s linear infinite;"><p class="scene__text">Sabes porquê? Sem <span class="hl">chamada à acção</span></p></div>
  <div class="scene scene--punch" style="animation: scene5 28.00s linear infinite;"><p class="scene__text">Bonito não vende. <span class="hl">Conversão vende</span></p></div>
  <div class="scene scene--cta" style="animation: scene6 28.00s linear infinite;"><p class="scene__text">Auditamos o teu site. <span class="hl">PontoFinal.site</span></p></div>
  </div>
  <div class="sweep" style="animation: sweep1 28.00s linear infinite;"></div>
  <div class="sweep" style="animation: sweep2 28.00s linear infinite;"></div>
  <div class="sweep" style="animation: sweep3 28.00s linear infinite;"></div>
  <div class="sweep" style="animation: sweep4 28.00s linear infinite;"></div>
  <div class="sweep" style="animation: sweep5 28.00s linear infinite;"></div>
  <div class="sweep" style="animation: sweep6 28.00s linear infinite;"></div>
  <div class="footer-arrow">↓</div>
  <audio class="voice" data-idx="0" preload="auto" src="../audio/voices/r001_s1.mp3"></audio>
  <audio class="voice" data-idx="1" preload="auto" src="../audio/voices/r001_s2.mp3"></audio>
  <audio class="voice" data-idx="2" preload="auto" src="../audio/voices/r001_s3.mp3"></audio>
  <audio class="voice" data-idx="3" preload="auto" src="../audio/voices/r001_s4.mp3"></audio>
  <audio class="voice" data-idx="4" preload="auto" src="../audio/voices/r001_s5.mp3"></audio>
  <audio class="voice" data-idx="5" preload="auto" src="../audio/voices/r001_s6.mp3"></audio>
</section>
<script>
(function () {
  // Responsive scale: fit reel to iframe/window viewport
  const r = document.querySelector('.reel');
  function fit() {
    const sw = window.innerWidth / 1080;
    const sh = window.innerHeight / 1920;
    r.style.transform = 'scale(' + Math.min(sw, sh) + ')';
  }
  fit();
  addEventListener('resize', fit);

  // Auto-fit text: shrink font until each scene's text fits its container
  // without breaking words. Runs once after fonts load.
  function fitText() {
    document.querySelectorAll('.scene').forEach(scene => {
      const t = scene.querySelector('.scene__text');
      if (!t) return;
      let size = parseFloat(getComputedStyle(t).fontSize);
      const minSize = 40;
      let safety = 50;
      while (safety-- > 0 && size > minSize) {
        const overW = t.scrollWidth > scene.clientWidth;
        const overH = t.scrollHeight > scene.clientHeight;
        if (!overW && !overH) break;
        size = Math.floor(size * 0.94);
        t.style.fontSize = size + 'px';
      }
    });
  }
  // Run after fonts ready so measurements are correct
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitText);
  } else {
    setTimeout(fitText, 200);
  }
  addEventListener('resize', () => {
    // Reset font sizes before re-fitting on resize
    document.querySelectorAll('.scene__text').forEach(t => t.style.fontSize = '');
    setTimeout(fitText, 50);
  });

  // Voice playback: trigger pre-rendered Piper TTS clip at each scene start.
  // Only when ?audio=1 (overlay only — thumbnails silent).
  const wantAudio = new URLSearchParams(location.search).get('audio') === '1';
  if (!wantAudio) return;
  const DURATION_MS = 28000;
  const NUM_SCENES = 6;
  const STEP_MS = DURATION_MS / NUM_SCENES;
  const voices = Array.from(document.querySelectorAll('audio.voice'));
  voices.forEach(v => { v.volume = 1.0; v.preload = 'auto'; });
  function playVoice(i) {
    const v = voices[i];
    if (!v) return;
    try { v.pause(); v.currentTime = 0; } catch (_) {}
    v.play().catch(() => {});
  }
  function scheduleLoop() {
    for (let i = 0; i < NUM_SCENES; i++) setTimeout(() => playVoice(i), i * STEP_MS);
  }
  scheduleLoop();
  setInterval(scheduleLoop, DURATION_MS);
  // Kick first scene immediately on user interaction (autoplay policy)
  ['click','touchstart'].forEach(e => addEventListener(e, () => playVoice(0), {once: true}));
})();
</script>

<audio id="reel-audio" src="../audio/lofi_loop.mp3" loop preload="auto"
       style="position:fixed;bottom:8px;right:8px;z-index:99;width:170px;opacity:0.85;display:none"></audio>
<script>
(function () {
  const a = document.getElementById('reel-audio');
  if (!a) return;
  const wantAudio = new URLSearchParams(location.search).get('audio') === '1';
  if (wantAudio) {
    a.muted = false;
    a.volume = 0.18; // soft bed so voice stays foreground
    a.controls = true;
    a.style.display = 'block';
    a.play().catch(() => {});
  } else {
    a.muted = true;
  }
})();
</script>
</body>
</html>
