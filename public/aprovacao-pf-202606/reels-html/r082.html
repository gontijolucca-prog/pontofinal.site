<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ginásio local: 43 inscrições em 2 meses</title>
<style>
  :root {
    --bg: #FFFFFF; --ink: #050505; --accent: #FF2A2A;
    --dot: rgba(5,5,5,0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
    position: relative;
  }
  .reel {
    position: absolute; top: 50%; left: 50%;
    margin-top: -960px; margin-left: -540px;
    width: 1080px; height: 1920px;
    background: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1.8px, transparent 1.8px);
    background-size: 44px 44px;
    overflow: hidden;
    transform-origin: center center;
    animation: bg-drift 4s linear infinite;
  }
  @keyframes bg-drift {
    0%   { background-position: 0 0; }
    100% { background-position: 44px 44px; }
  }
  .reel::before {
    content: ""; position: absolute; inset: 60px;
    border: 6px solid var(--ink);
    pointer-events: none; z-index: 1;
  }
  .brand {
    position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    z-index: 5;
    background: var(--ink); color: #FFF;
    padding: 14px 28px; border: 4px solid var(--ink);
    font: 900 32px/1 'Arial Black', sans-serif;
    letter-spacing: -0.02em; text-transform: lowercase;
  }
  .progress {
    position: absolute; top: 60px; left: 60px; right: 60px; height: 8px;
    background: rgba(5,5,5,0.08); z-index: 4;
  }
  .progress::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); transform-origin: left center;
    animation: progress 18.650s linear infinite;
  }
  @keyframes progress {
    0% { transform: scaleX(0); } 100% { transform: scaleX(1); }
  }

  /* Graphics layer — TOP 60%, persistent ~2.5s */
  .g-layer {
    position: absolute;
    inset: 220px 90px 880px;
    z-index: 3;
    pointer-events: none;
  }
  .g-item {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    opacity: 0;
    will-change: opacity;
  }

  /* Chunks — position changes whether a graphic is concurrently visible */
  .chunk {
    position: absolute;
    display: grid; place-items: center;
    opacity: 0;
    will-change: opacity;
    z-index: 2;
  }
  .chunk--center {
    /* No concurrent graphic — text vertically centered in main area */
    inset: 360px 110px 460px;
  }
  .chunk--lower {
    /* Concurrent graphic — text in lower third, graphic occupies upper */
    inset: 1140px 110px 280px;
  }
  .chunk__text {
    font: 900 124px/1.04 'Arial Black', sans-serif;
    color: var(--ink);
    letter-spacing: -0.035em;
    text-transform: uppercase;
    text-align: center;
    max-width: 860px;
    word-break: normal; overflow-wrap: normal; hyphens: manual;
  }
  .hl {
    display: inline-block;
    background: var(--accent); color: #FFF;
    padding: 4px 22px 14px;
    border: 6px solid var(--ink);
    box-shadow: 10px 10px 0 0 var(--ink);
    margin: 6px 4px; transform: rotate(-1.4deg);
  }

  /* Motion graphic widgets */
  .g-counter {
    display: grid; grid-auto-flow: row; place-items: center;
    text-align: center;
  }
  .g-counter--prefix, .g-counter--percent {
    grid-auto-flow: column; align-items: baseline; gap: 20px;
  }
  .g-counter__num {
    font: 900 380px/0.95 'Arial Black', sans-serif;
    color: var(--ink);
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
  }
  .g-counter__suffix {
    font: 900 76px/1 'Arial Black', sans-serif;
    color: var(--ink);
    letter-spacing: -0.02em; text-transform: uppercase;
    margin-top: 14px;
  }
  .g-counter__prefix, .g-counter__symbol {
    font: 900 240px/1 'Arial Black', sans-serif;
    color: var(--accent);
    letter-spacing: -0.03em;
  }
  .g-stamp {
    display: inline-block;
    background: var(--accent); color: #FFF;
    padding: 32px 70px 44px;
    border: 8px solid var(--ink);
    box-shadow: 20px 20px 0 0 var(--ink);
    transform: rotate(-3.5deg);
    font: 900 130px/1 'Arial Black', sans-serif;
    text-transform: uppercase; letter-spacing: -0.02em;
    animation: stamp-pop 0.55s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes stamp-pop {
    0%   { transform: rotate(-12deg) scale(0.25); opacity: 0; }
    60%  { transform: rotate(-1deg) scale(1.08); opacity: 1; }
    100% { transform: rotate(-3.5deg) scale(1); opacity: 1; }
  }
  .g-bars {
    display: grid; gap: 32px; width: 100%; padding: 0 24px;
  }
  .g-bar {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 22px; align-items: center;
  }
  .g-bar__label {
    font: 900 60px/1 'Arial Black', sans-serif;
    text-transform: uppercase; color: var(--ink);
  }
  .g-bar__track {
    position: relative; height: 92px;
    background: rgba(5,5,5,0.07);
    border: 4px solid var(--ink);
  }
  .g-bar__fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0; background: var(--accent);
    animation: bar-grow 1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes bar-grow {
    from { width: 0; }
    to   { width: var(--target, 100%); }
  }
  .g-bar__value {
    position: absolute;
    right: -8px; top: 50%; transform: translate(100%, -50%);
    font: 900 54px/1 'Arial Black', sans-serif;
    color: var(--ink);
    padding-left: 18px;
  }

  .footer-arrow {
    position: absolute;
    bottom: 96px; left: 50%; transform: translateX(-50%);
    z-index: 4;
    font: 900 88px/1 'Arial Black', sans-serif;
    color: var(--accent);
    animation: arrow 1.8s ease-in-out infinite;
  }
  @keyframes arrow {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 14px); }
  }

  @keyframes chunk0 {
              0% { opacity: 1; }
              18.214% { opacity: 1; }
              18.231%, 100% { opacity: 0; }
            }
@keyframes chunk1 {
              0%, 18.214% { opacity: 0; }
              18.231% { opacity: 1; }
              40.466% { opacity: 1; }
              40.483%, 100% { opacity: 0; }
            }
@keyframes chunk2 {
              0%, 40.466% { opacity: 0; }
              40.483% { opacity: 1; }
              60.038% { opacity: 1; }
              60.054%, 100% { opacity: 0; }
            }
@keyframes chunk3 {
              0%, 60.038% { opacity: 0; }
              60.054% { opacity: 1; }
              77.196% { opacity: 1; }
              77.212%, 100% { opacity: 0; }
            }
@keyframes chunk4 {
              0%, 77.196% { opacity: 0; }
              77.212% { opacity: 1; }
              99.984% { opacity: 1; }
              100.000%, 100% { opacity: 0; }
            }
  @keyframes graphic0 {
              0%, 60.038% { opacity: 0; }
              60.054% { opacity: 1; }
              72.654% { opacity: 1; }
              73.458%, 100% { opacity: 0; }
            }
</style>
</head>
<body>
<section class="reel" aria-label="Ginásio local: 43 inscrições em 2 meses">
  <div class="progress"></div>
  <div class="brand">Pontofinal.site_</div>
  <div class="g-layer">
  <div class="g-item" data-gidx="0" style="animation: graphic0 18.650s linear infinite;"><div class="g-counter" data-to="43"><span class="g-counter__num">0</span><span class="g-counter__suffix">inscrições</span></div></div>
  </div>
  <div class="stage">
  <div class="chunk chunk--center" data-idx="0" style="animation: chunk0 18.650s linear infinite;"><p class="chunk__text">Ginásio top. Site <span class="hl">invisível</span>.</p></div>
  <div class="chunk chunk--center" data-idx="1" style="animation: chunk1 18.650s linear infinite;"><p class="chunk__text">Quem procurava online, achava <span class="hl">o concorrente</span></p></div>
  <div class="chunk chunk--center" data-idx="2" style="animation: chunk2 18.650s linear infinite;"><p class="chunk__text">Site novo. Fotos. <span class="hl">Preços</span>. Turmas.</p></div>
  <div class="chunk chunk--lower" data-idx="3" style="animation: chunk3 18.650s linear infinite;"><p class="chunk__text"><span class="hl">43</span> inscrições no 1.º mês</p></div>
  <div class="chunk chunk--center" data-idx="4" style="animation: chunk4 18.650s linear infinite;"><p class="chunk__text">O teu site mostra o que tens? <span class="hl">PontoFinal.site</span></p></div>
  </div>
  <div class="footer-arrow">↓</div>
  <audio id="beat" src="../audio/beat.mp3" loop preload="auto"></audio>
</section>
<script>
(function () {
  const TOTAL_MS = 18650;
  const COUNTERS = [{"g_idx": 0, "to": 43, "start": 11200, "end": 13700}];
  const CHUNK_STARTS = [0, 3400, 7550, 11200, 14400];
  const NOTIF_URL = '../audio/notif.mp3';

  const r = document.querySelector('.reel');
  function fit() {
    const sw = window.innerWidth / 1080;
    const sh = window.innerHeight / 1920;
    r.style.transform = 'scale(' + Math.min(sw, sh) + ')';
  }
  fit();
  addEventListener('resize', fit);

  // Auto-fit text: shrink chunk text until it fits without breaking words
  function fitText() {
    document.querySelectorAll('.chunk').forEach(scene => {
      const t = scene.querySelector('.chunk__text');
      if (!t) return;
      t.style.fontSize = '';
      let size = parseFloat(getComputedStyle(t).fontSize);
      const minSize = 50;
      let safety = 60;
      while (safety-- > 0 && size > minSize) {
        const overW = t.scrollWidth > scene.clientWidth;
        const overH = t.scrollHeight > scene.clientHeight;
        if (!overW && !overH) break;
        size = Math.floor(size * 0.94);
        t.style.fontSize = size + 'px';
      }
    });
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitText);
  } else {
    setTimeout(fitText, 200);
  }
  addEventListener('resize', () => setTimeout(fitText, 50));

  // Bar fills
  document.querySelectorAll('.g-bar').forEach(bar => {
    const t = bar.dataset.target || '100';
    const fill = bar.querySelector('.g-bar__fill');
    if (fill) fill.style.setProperty('--target', t + '%');
  });

  // Web Audio: load notification SFX once, replay per chunk entrance (allows overlap)
  const AC = window.AudioContext || window.webkitAudioContext;
  const audioCtx = AC ? new AC() : null;
  let notifBuf = null;
  if (audioCtx) {
    fetch(NOTIF_URL).then(r => r.arrayBuffer())
      .then(b => audioCtx.decodeAudioData(b))
      .then(buf => { notifBuf = buf; })
      .catch(() => {});
  }
  function playNotif() {
    // Gate on state — without this, all suspended-queue starts fire at once when context resumes
    if (!audioCtx || !notifBuf || audioCtx.state !== 'running') return;
    const src = audioCtx.createBufferSource();
    src.buffer = notifBuf;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.55;
    src.connect(gain).connect(audioCtx.destination);
    try { src.start(); } catch (e) {}
  }

  const beat = document.getElementById('beat');
  const t0 = performance.now();
  function getT() { return (performance.now() - t0) % TOTAL_MS; }

  const graphicEls = document.querySelectorAll('.g-item');
  let lastChunkPlayed = -1;
  let lastLoop = -1;
  function tick() {
    const elapsed = performance.now() - t0;
    const loopIdx = Math.floor(elapsed / TOTAL_MS);
    const t = elapsed % TOTAL_MS;

    if (loopIdx !== lastLoop) {
      lastChunkPlayed = -1;
      lastLoop = loopIdx;
    }
    let cur = -1;
    for (let i = 0; i < CHUNK_STARTS.length; i++) {
      if (CHUNK_STARTS[i] <= t) cur = i; else break;
    }
    if (cur > lastChunkPlayed) {
      playNotif();
      lastChunkPlayed = cur;
    }

    for (const cm of COUNTERS) {
      const el = graphicEls[cm.g_idx];
      if (!el) continue;
      const numEl = el.querySelector('.g-counter__num');
      if (!numEl) continue;
      const window_ms = cm.end - cm.start;
      const rampMs = Math.min(window_ms * 0.45, 1200);
      const elapsedT = t - cm.start;
      let p = 0;
      if (elapsedT >= 0 && elapsedT < window_ms) {
        p = Math.min(1, elapsedT / Math.max(rampMs, 300));
      } else if (elapsedT >= window_ms) {
        p = 1;
      }
      numEl.textContent = Math.round(p * cm.to);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Audio gate (browsers require user gesture to start AudioContext)
  const wantAudio = new URLSearchParams(location.search).get('audio') === '1';
  if (beat) beat.loop = true;
  function unlock() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (beat) { beat.muted = false; beat.volume = 0.15; beat.play().catch(() => {}); }
  }
  if (wantAudio) {
    unlock();
    ['click','touchstart','keydown'].forEach(e => addEventListener(e, unlock, {once: true}));
  } else {
    if (beat) beat.muted = true;
    // Even when muted overall, allow click to enable audio mid-preview
    ['click','touchstart'].forEach(e => addEventListener(e, unlock, {once: true}));
  }
})();
</script>
</body>
</html>
