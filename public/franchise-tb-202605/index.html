<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Conteúdos TechBody</title>
<meta name="app-version" content="20260527-1810" />

<script>
  // Auto cache-bust por versão + Service Worker registration.
  // Garante que cada deploy é apanhado automaticamente em todos os browsers.
  (function() {
    try {
      var meta = document.querySelector('meta[name="app-version"]');
      var current = meta ? meta.getAttribute('content') : '';
      if (current && sessionStorage.getItem('pf-bust-v') !== current &&
          !window.location.search.includes('_=')) {
        sessionStorage.setItem('pf-bust-v', current);
        window.location.replace(
          window.location.pathname + '?_=' + Date.now() + window.location.hash
        );
        return;
      }
    } catch (e) {}
  })();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    });
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;800;900&family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f3ee; --text: #0a0a0a; --mute: #6b6862; --accent: #FF2A2A;
    --line: #0a0a0a;
  }
  html, body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; min-height: 100%; }
  body { padding: 32px 24px 80px; }

  header { max-width: 1100px; margin: 0 auto 48px; }
  h1 { font: 800 clamp(32px, 5vw, 64px)/0.96 'Fraunces', serif; letter-spacing: -0.03em; max-width: 14ch; }
  .sub { margin-top: 12px; font-size: 14px; color: var(--mute); max-width: 50ch; line-height: 1.5; }

  .filters {
    max-width: 1100px; margin: 24px auto;
    display: flex; gap: 8px; flex-wrap: wrap;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
  }
  .filter-chip {
    padding: 6px 12px;
    background: transparent;
    border: 2px solid var(--line);
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: all 120ms;
  }
  .filter-chip[data-active="true"] { background: var(--line); color: var(--bg); }
  .filter-chip:hover { transform: translateY(-1px); }

  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  .card {
    background: #fff;
    border: 2px solid var(--line);
    display: grid; grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }
  .card__preview {
    aspect-ratio: 4/5;
    background: #f0eee8;
    overflow: hidden;
    position: relative;
  }
  .card__preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card__preview iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; transform: scale(1.0); transform-origin: top left; }
  .card[data-format="story"] .card__preview,
  .card[data-format="reel"]  .card__preview { aspect-ratio: 9/16; }
  .card__body { padding: 16px; }
  .card__title { font: 800 16px/1.2 'Fraunces', serif; letter-spacing: -0.01em; margin-bottom: 6px; }
  .card__meta { font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.1em; }
  .card__approved-by {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--text);
    border-top: 1px dashed rgba(10,10,10,0.25);
    padding-top: 10px;
  }
  .card__approved-by strong { font-weight: 800; color: var(--accent); }
  .card__actions {
    border-top: 2px solid var(--line);
    display: grid;
    grid-template-columns: 1fr;
  }
  .card__btn {
    padding: 12px;
    border: 0;
    border-left: 2px solid var(--line);
    background: var(--bg);
    cursor: pointer;
    font: 700 11px/1 'JetBrains Mono';
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text);
    text-decoration: none;
    text-align: center;
  }
  .card__btn:first-child { border-left: 0; }
  .card__btn:hover { background: var(--accent); color: var(--bg); }
  .card__btn--primary { background: var(--text); color: var(--bg); }
  .card__btn--primary:hover { background: var(--accent); }

  .empty {
    max-width: 600px; margin: 80px auto;
    text-align: center;
    padding: 40px 24px;
    border: 2px dashed var(--mute);
  }
  .empty p { font-size: 14px; color: var(--mute); line-height: 1.6; }

  .caption-block {
    padding: 12px 16px;
    background: #fafaf8;
    border-top: 1px dashed var(--mute);
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    color: var(--text);
    max-height: 160px;
    overflow-y: auto;
  }
  .caption-block strong { display: block; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px; color: var(--mute); }

  footer {
    max-width: 1100px; margin: 80px auto 0;
    padding-top: 24px;
    border-top: 2px solid var(--line);
    font-size: 10px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.16em;
  }
  .loader-state {
    max-width: 600px; margin: 80px auto;
    text-align: center;
    padding: 40px;
    font-family: 'JetBrains Mono';
    color: var(--mute);
  }
</style>
</head>
<body>

<header>
  <h1>Conteúdos TechBody.</h1>
  <p class="sub">
    Conteúdo aprovado, prontos a descarregar. Escolhe o mês.
  </p>
</header>

<div class="filters" id="monthFilters" style="margin-bottom:8px"></div>

<div class="filters" id="filters">
  <button class="filter-chip" data-active="true" data-filter="all">Todos</button>
  <button class="filter-chip" data-filter="carrossel">Carrosséis</button>
  <button class="filter-chip" data-filter="story">Stories</button>
  <button class="filter-chip" data-filter="reel">Reels</button>
</div>

<div id="state" class="loader-state">A carregar conteúdo aprovado…</div>
<div id="grid" class="grid" hidden></div>
<div id="empty" class="empty" hidden>
  <p>Ainda não existem posts aprovados para este mês. Verifica novamente em breve.</p>
</div>

<footer>
  TechBody · {month}
</footer>

<script>
  // Franchise consulta Supabase directamente (REST) para obter as
  // aprovações feitas na página de preview. Só items com status="approved"
  // aparecem aqui. Sem SDK — fetch puro para evitar peso e bloqueios ETP.
  const ALLOWED_BRAND = "techbody";
  const NAMESPACE = "cm-approval-tb-v1";
  const SUPABASE_URL = "https://ojbigtskkhmnerrppdjq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qYmlndHNra2htbmVycnBwZGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjk1MDksImV4cCI6MjA5NDYwNTUwOX0.gFcdOh19siLqTzTsmoYDs2ZjA4l3uykRs01sRebkdZQ";

  const state = { items: [], captions: {}, approvals: {}, filter: "all", month: "" };
  const els = {
    grid: document.getElementById("grid"),
    state: document.getElementById("state"),
    empty: document.getElementById("empty"),
    filters: document.getElementById("filters"),
    monthFilters: document.getElementById("monthFilters"),
  };

  function monthLabel(yyyymm) {
    const map = {"01":"Janeiro","02":"Fevereiro","03":"Março","04":"Abril","05":"Maio","06":"Junho","07":"Julho","08":"Agosto","09":"Setembro","10":"Outubro","11":"Novembro","12":"Dezembro"};
    const [y, m] = (yyyymm || "").split("-");
    return (map[m] || m) + " " + y;
  }

  async function loadItems() {
    const res = await fetch("data/items.json", { cache: "no-store" });
    const items = await res.json();
    return items.filter(it => it.brand === ALLOWED_BRAND);
  }
  async function loadCaptions() {
    try {
      const res = await fetch("data/captions.json", { cache: "no-store" });
      return await res.json();
    } catch { return {}; }
  }
  function decodeNote(raw) {
    if (!raw) return { author: null, text: "" };
    if (typeof raw !== "string") return { author: null, text: String(raw) };
    const s = raw.trim();
    if (s.startsWith("{") && s.endsWith("}")) {
      try {
        const o = JSON.parse(s);
        if (o && typeof o === "object") return { author: o.a || null, text: o.t || "" };
      } catch {}
    }
    return { author: null, text: raw };
  }

  // Proxy same-origin primeiro (passa Brave Shields / Safari ITP),
  // fallback para Supabase REST directo.
  const APPROVALS_ENDPOINTS = ["/api/approvals", `${SUPABASE_URL}/rest/v1/approvals`];
  async function loadApprovals() {
    const query = `namespace=eq.${encodeURIComponent(NAMESPACE)}&status=eq.approved&select=item_id,note,updated_at`;
    for (const base of APPROVALS_ENDPOINTS) {
      const isProxy = base.startsWith("/api/");
      try {
        const headers = { "Content-Type": "application/json" };
        if (!isProxy) {
          headers.apikey = SUPABASE_ANON_KEY;
          headers.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
        }
        const res = await fetch(`${base}?${query}`, { headers, cache: "no-store" });
        if (!res.ok) continue;
        const ct = res.headers.get("content-type") || "";
        if (!ct.includes("json")) continue;
        const rows = await res.json();
        const out = {};
        for (const r of rows) {
          const dec = decodeNote(r.note);
          out[r.item_id] = { author: dec.author || "anónimo", approvedAt: r.updated_at };
        }
        return out;
      } catch (e) {
        console.warn(`[franchise] approvals via ${base} falhou:`, e);
      }
    }
    return {};
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function fmtApprovedAt(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return "agora";
      if (diff < 3600) return `há ${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `há ${Math.floor(diff / 3600)} h`;
      return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "short" });
    } catch { return ""; }
  }

  function renderCard(it) {
    const isCarousel = it.format === "carrossel";
    const url = it.html_url;
    const dlUrl = isCarousel
      ? url.replace(/\.html$/, ".zip").replace(".playback.zip", ".zip")
      : url.replace(/\.html$/, ".png").replace(".playback.png", ".png");
    const dlLabel = isCarousel ? "⤓ Carrossel completo" : "⤓ Imagem";
    const dlName  = isCarousel ? (it.id + ".zip") : (it.id + ".png");

    const cap = state.captions[it.id];
    const captionHtml = cap ? `
      <div class="caption-block">
        <strong>Caption Instagram</strong>
        ${escapeHtml(cap.caption || "")}${cap.hashtags ? "\n\n" + escapeHtml(cap.hashtags) : ""}
      </div>
    ` : "";

    const apr = state.approvals[it.id];
    const approvedBy = apr && apr.author
      ? `<p class="card__approved-by">Aprovado por <strong>${escapeHtml(apr.author)}</strong>${apr.approvedAt ? ` · ${fmtApprovedAt(apr.approvedAt)}` : ""}</p>`
      : "";

    return `
      <article class="card" data-format="${it.format}">
        <div class="card__preview">
          <iframe src="${url}" loading="lazy" aria-label="${escapeHtml(it.title || "")}"></iframe>
        </div>
        <div class="card__body">
          <h3 class="card__title">${escapeHtml(it.title || it.theme)}</h3>
          <p class="card__meta">${it.format} · ${it.scheduled_for || ""} · ${it.hour || ""}</p>
          ${approvedBy}
        </div>
        ${captionHtml}
        <div class="card__actions">
          <a class="card__btn card__btn--primary" href="${dlUrl}" download="${dlName}">${dlLabel}</a>
        </div>
      </article>
    `;
  }

  function renderMonthFilters() {
    const months = Array.from(new Set(state.items.map(it => it.month).filter(Boolean))).sort().reverse();
    if (months.length === 0) { els.monthFilters.innerHTML = ""; return; }
    if (!state.month || !months.includes(state.month)) state.month = months[0];
    els.monthFilters.innerHTML = months.map(m => `
      <button class="filter-chip" data-month="${m}" data-active="${m === state.month}">${monthLabel(m)}</button>
    `).join("");
  }

  function render() {
    const approvedItems = state.items.filter(it => state.approvals[it.id]);
    const monthFiltered = state.month
      ? approvedItems.filter(it => it.month === state.month)
      : approvedItems;
    const visible = state.filter === "all"
      ? monthFiltered
      : monthFiltered.filter(it => it.format === state.filter);

    els.state.hidden = true;
    if (visible.length === 0) {
      // Esvazia + esconde — o CSS `.grid { display: grid }` tem prioridade sobre
      // o atributo [hidden], então se mantivermos children o card antigo
      // continua a renderizar mesmo com hidden=true. Limpar innerHTML resolve.
      els.grid.innerHTML = "";
      els.grid.hidden = true;
      els.empty.hidden = false;
      return;
    }
    els.empty.hidden = true;
    els.grid.hidden = false;
    els.grid.innerHTML = visible.map(renderCard).join("");
  }

  els.filters.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-filter]");
    if (!btn) return;
    state.filter = btn.dataset.filter;
    els.filters.querySelectorAll("[data-filter]").forEach(b => {
      b.dataset.active = b === btn ? "true" : "false";
    });
    render();
  });

  els.monthFilters.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-month]");
    if (!btn) return;
    state.month = btn.dataset.month;
    els.monthFilters.querySelectorAll("[data-month]").forEach(b => {
      b.dataset.active = b === btn ? "true" : "false";
    });
    document.querySelector("footer").textContent = "TechBody · " + monthLabel(state.month);
    render();
  });

  (async () => {
    try {
      const [items, captions, approvals] = await Promise.all([
        loadItems(),
        loadCaptions(),
        loadApprovals(),
      ]);
      state.items = items;
      state.captions = captions;
      state.approvals = approvals;
      renderMonthFilters();
      document.querySelector("footer").textContent = "TechBody · " + monthLabel(state.month);
      render();

      // Polling 5s — quando uma aprovação chega via página /aprovacao-*/,
      // este loop pega no diff e re-rendariza. Mantém-se simples sem WS,
      // funciona mesmo se Supabase Realtime estiver desligado.
      setInterval(async () => {
        if (document.hidden) return;
        try {
          const next = await loadApprovals();
          const before = Object.keys(state.approvals).length;
          const after = Object.keys(next).length;
          // Detecta também mudanças no autor / approvedAt de items existentes
          let changed = before !== after;
          if (!changed) {
            for (const id in next) {
              const a = state.approvals[id], b = next[id];
              if (!a || a.author !== b.author || a.approvedAt !== b.approvedAt) { changed = true; break; }
            }
          }
          if (changed) {
            state.approvals = next;
            render();
          }
        } catch (e) {
          console.warn("[franchise] poll falhou:", e);
        }
      }, 5000);
    } catch (err) {
      console.error(err);
      els.state.textContent = "Falha a carregar. Tenta de novo mais tarde.";
    }
  })();
</script>

</body>
</html>
