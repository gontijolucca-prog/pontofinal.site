<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>PontoFinal — r10-sinais-de-confianca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #050505;
      --primary: #FF2A2A;
      --muted: #6a6a6a;
      --shadow-sm: 5px 5px 0 0 #050505;
      --font-display: 'Archivo Black', 'Archivo', Impact, sans-serif;
      --font-body: 'Archivo', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .dots-bg {
      position: absolute;
      inset: -60px;
      background-image: radial-gradient(circle, #050505 1.3px, transparent 1.3px);
      background-size: 32px 32px;
      opacity: 0.42;
      pointer-events: none;
      z-index: 1;
      animation: dots-drift 18s linear infinite;
      will-change: background-position;
    }
    @keyframes dots-drift {
      0%   { background-position: 0 0; }
      100% { background-position: 64px 64px; }
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 120px 100px 110px;
      z-index: 2;
    }
    .brand-header {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .brand-header .dot { color: var(--primary); }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .hero {
      font-family: var(--font-display);
      font-size: 100px;
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -0.035em;
      text-wrap: balance;
      max-width: 820px;
      margin-bottom: 50px;
      color: var(--text);
      text-align: center;
    }
    .id-card {
      background: #FFFFFF;
      border: 4px solid var(--text);
      width: 380px;
      padding: 28px;
      position: relative;
      margin-bottom: 50px;
      box-shadow: 14px 14px 0 0 var(--text);
    }
    .id-photo {
      background: #050505;
      width: 100%;
      height: 120px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--text);
    }
    .id-photo::before {
      content: '📷';
      font-size: 48px;
      opacity: 0.3;
    }
    .id-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--muted);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .id-label {
      color: var(--muted);
      font-weight: 700;
    }
    .id-value {
      color: var(--text);
      font-weight: 700;
    }
    .id-name {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      color: var(--text);
    }
    .id-seal {
      position: absolute;
      top: -12px;
      right: 24px;
      background: var(--primary);
      color: #FFFFFF;
      border: 3px solid var(--text);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 6px 6px 0 0 var(--text);
      transform: rotate(-15deg);
    }
    .id-seal-text {
      font-size: 12px;
      line-height: 1.1;
    }
    .cta-box {
      background: var(--primary);
      color: #FFFFFF;
      padding: 20px 40px;
      border: 4px solid var(--text);
      box-shadow: 10px 10px 0 0 var(--text);
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      display: inline-block;
    }
    .footer {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: center;
      color: var(--text);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="dots-bg"></div>
  <div class="container">
    <div class="brand-header">Ponto Final<span class="dot">.</span></div>
    <div class="main">
      <h1 class="hero">
        5 segundos para <span class="red">confiança.</span>
      </h1>

      <div class="id-card">
        <div class="id-seal">
          <div class="id-seal-text">VERIFI-<br>CADO</div>
        </div>
        <div class="id-photo"></div>
        <div class="id-name">Empresa Real</div>
        <div class="id-row">
          <span class="id-label">Fotos</span>
          <span class="id-value">REAIS</span>
        </div>
        <div class="id-row">
          <span class="id-label">Testemunhos</span>
          <span class="id-value">COM NOME</span>
        </div>
        <div class="id-row">
          <span class="id-label">Clientes</span>
          <span class="id-value">VISÍVEIS</span>
        </div>
      </div>

      <div class="cta-box">confiança</div>
    </div>
    <div class="footer">pontofinal.site · link na bio</div>
  </div>
</body>
</html>
