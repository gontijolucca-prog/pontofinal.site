<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>PontoFinal — r11-urgencia-sem-mentir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #050505;
      --primary: #FF2A2A;
      --muted: #6a6a6a;
      --shadow-sm: 5px 5px 0 0 #050505;
      --font-display: 'Archivo Black', 'Archivo', Impact, sans-serif;
      --font-body: 'Archivo', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .dots-bg {
      position: absolute;
      inset: -60px;
      background-image: radial-gradient(circle, #050505 1.3px, transparent 1.3px);
      background-size: 32px 32px;
      opacity: 0.42;
      pointer-events: none;
      z-index: 1;
      animation: dots-drift 18s linear infinite;
      will-change: background-position;
    }
    @keyframes dots-drift {
      0%   { background-position: 0 0; }
      100% { background-position: 64px 64px; }
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 120px 100px 110px;
      z-index: 2;
    }
    .brand-header {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .brand-header .dot { color: var(--primary); }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .hero {
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -0.035em;
      text-wrap: balance;
      max-width: 820px;
      margin-bottom: 50px;
      color: var(--text);
      text-align: center;
    }
    .hero .red { color: var(--primary); }
    .urgency-comparison {
      display: flex;
      gap: 40px;
      justify-content: center;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }
    .urgency-box {
      flex: 0 1 300px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .urgency-label {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      text-align: center;
    }
    .urgency-box.bad .urgency-label {
      color: var(--muted);
    }
    .urgency-box.good .urgency-label {
      color: var(--primary);
    }
    .stamp {
      background: #FFFFFF;
      border: 4px solid var(--text);
      padding: 28px 32px;
      text-align: center;
      position: relative;
      transform: rotate(-8deg);
      margin-bottom: 16px;
      box-shadow: 8px 8px 0 0 var(--text);
    }
    .urgency-box.bad .stamp {
      opacity: 0.6;
      border-color: var(--muted);
    }
    .urgency-box.good .stamp {
      background: #FFE2E2;
      border-color: var(--primary);
      border: 4px solid var(--primary);
    }
    .stamp-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .urgency-box.bad .stamp-text {
      color: var(--muted);
      text-decoration: line-through;
    }
    .urgency-box.good .stamp-text {
      color: var(--primary);
    }
    .stamp-detail {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }
    .urgency-box.good .stamp-detail {
      color: var(--primary);
    }
    .icon {
      font-size: 32px;
    }
    .urgency-box.bad .icon { opacity: 0.4; }
    .cta-box {
      background: var(--primary);
      color: #FFFFFF;
      padding: 20px 40px;
      border: 4px solid var(--text);
      box-shadow: 10px 10px 0 0 var(--text);
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      display: inline-block;
    }
    .footer {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: center;
      color: var(--text);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="dots-bg"></div>
  <div class="container">
    <div class="brand-header">Ponto Final<span class="dot">.</span></div>
    <div class="main">
      <h1 class="hero">
        Urgência só funciona <span class="red">quando é verdade.</span>
      </h1>

      <div class="urgency-comparison">
        <div class="urgency-box bad">
          <div class="urgency-label">Mentira</div>
          <div class="stamp">
            <div class="stamp-text">ÚLTIMOS DIAS!</div>
            <div class="stamp-detail">(há 3 meses)</div>
          </div>
          <div class="icon">✗</div>
        </div>
        <div class="urgency-box good">
          <div class="urgency-label">Verdade</div>
          <div class="stamp">
            <div class="stamp-text">SEXTA 23h59</div>
            <div class="stamp-detail">Restam 12 lugares</div>
          </div>
          <div class="icon">✓</div>
        </div>
      </div>

      <div class="cta-box">urgência honesta</div>
    </div>
    <div class="footer">pontofinal.site · link na bio</div>
  </div>
</body>
</html>
