<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TechBody · ritmo_verao · story</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;400;800;900&family=JetBrains+Mono:wght@300;400;600&display=swap&family=Titillium+Web:wght@200;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #333333;
  --primary: #333333;
  --accent: #F69E1E;
  --text: #ffffff;
  --line: rgba(255,255,255,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a0c; color: var(--text); font-family: 'Trillium Web', 'Trillium Web', sans-serif; -webkit-font-smoothing: antialiased; }

/* Single story = full 9:16 poster, no scrolling, fits Instagram story 1080×1920 */
.story-single {
  position: relative;
  /* Force 9:16 box even when the viewport itself is wider/shorter. */
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  margin: 0 auto;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: clamp(40px, 6vw, 84px);
  overflow: hidden;
  font-family: 'Trillium Web', 'Trillium Web', sans-serif;
}

/* Atmospheric backdrop */
.story-single::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,0.05), transparent 38%),
    radial-gradient(circle at 88% 92%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 42%);
  pointer-events: none;
}

.bg-photo {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  z-index: 0;
}
.bg-photo::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 16%, transparent) 0%,
      color-mix(in srgb, var(--bg) 38%, transparent) 24%,
      color-mix(in srgb, var(--bg) 72%, transparent) 46%,
      color-mix(in srgb, var(--bg) 72%, transparent) 56%,
      color-mix(in srgb, var(--bg) 38%, transparent) 78%,
      color-mix(in srgb, var(--bg) 14%, transparent) 100%);
}

.story-single__top,
.story-single__body,
.story-single__bottom { position: relative; z-index: 2; }

.story-single__top {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 65%, transparent);
}
.story-single__top .brand {
  font-family: 'Trillium Web', 'Trillium Web', sans-serif; font-weight: 800;
  font-size: clamp(15px, 1.8vw, 19px);
  letter-spacing: 0.01em;
  color: var(--accent);
  text-transform: none;
}

.story-single__body {
  display: grid; align-content: center; gap: clamp(18px, 2.4vw, 28px);
  width: 100%; max-width: 88%;
  justify-items: center; justify-self: center; text-align: center;
}
.story-single__body::before {
  content: ""; width: 52px; height: 4px; border-radius: 2px;
  background: var(--accent); justify-self: center;
}

/* Headline variants — clean Manrope for dark brand; italic Fraunces stays for soft brand */
.story-single--type h1 {
  font-family: 'Trillium Web', 'Trillium Web', sans-serif;
  font-weight: 800;
  font-size: clamp(40px, 8.4vw, 102px);
  line-height: 1.0; letter-spacing: -0.035em;
  text-transform: none;
  max-width: 15ch;
  text-wrap: balance;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.story-single--type-soft h1 {
  font-family: 'Trillium Web', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(34px, 8.8vw, 112px);
  line-height: 1.02; letter-spacing: -0.022em;
  max-width: 15ch;
  text-wrap: balance;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.story-single--type-soft h1 em { color: var(--accent); font-style: italic; font-weight: 800; }

.story-single--num .num {
  font-family: 'Trillium Web', serif;
  font-weight: 800;
  font-style: italic;
  font-size: clamp(72px, 32vw, 320px);
  line-height: 0.86; letter-spacing: -0.06em;
  color: var(--accent);
}
.story-single--num h1 {
  font-family: 'Trillium Web', 'Trillium Web', sans-serif;
  font-weight: 500;
  font-size: clamp(14px, 3.2vw, 38px);
  line-height: 1.15; letter-spacing: -0.018em;
  text-transform: none;
  max-width: 22ch;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.story-single--num-soft .num {
  font-family: 'Trillium Web', serif;
  font-style: italic; font-weight: 800;
  color: var(--accent);
}
.story-single--num-soft h1 {
  font-family: 'Trillium Web', serif;
  font-style: italic; font-weight: 400;
  text-transform: none;
  letter-spacing: -0.02em;
}

.story-single--quote blockquote {
  font-family: 'Trillium Web', serif; font-style: italic;
  font-weight: 200;
  font-size: clamp(16px, 6.4vw, 78px);
  line-height: 1.12; letter-spacing: -0.022em;
  color: var(--text);
  max-width: 18ch;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.story-single--quote::before {
  content: "";
  position: absolute; left: clamp(40px, 6vw, 84px); top: 38%;
  width: 4px; height: 24vh; background: var(--accent);
  z-index: 1;
}
.story-single--quote .story-single__body { padding-left: clamp(20px, 3vw, 36px); }
.story-single--quote cite {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; font-style: normal;
  color: color-mix(in srgb, var(--text) 60%, transparent);
}

.story-single__bottom {
  display: flex; justify-content: space-between; align-items: end;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 55%, transparent);
  gap: 16px;
}
.story-single__cta {
  display: inline-block;
  background: var(--accent); color: #0a0a0c;
  padding: 10px 18px;
  font-family: 'Barlow', sans-serif; font-weight: 800;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  line-height: 1;
}
</style>
<!-- fx-loops -->
<style id="fx-loops">
/* ═══ FX loops — decorativos animados, texto estático (legível sempre) ═══ */
:root { --fxc: infinite; } /* render substitui por contagem finita */

.fx-orb {
  position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%;
  top: -12%; right: -14%; z-index: 0; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent), transparent 66%);
  filter: blur(36px);
  animation: fx-drift 12s ease-in-out var(--fxc);
}
@keyframes fx-drift {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: .75; }
  50%      { transform: translate(-9%, 10%) scale(1.18); opacity: 1; }
}

.slide__photo, .bg-photo, .slide--photo .photo {
  animation: fx-kenburns 12s ease-in-out var(--fxc);
  will-change: transform;
}
@keyframes fx-kenburns { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.num { animation: fx-float 6s ease-in-out var(--fxc); }
@keyframes fx-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

h1 em, blockquote em { animation: fx-em 4s ease-in-out var(--fxc); }
@keyframes fx-em { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

.arrow, .slide__cta, .story-single__cta { animation: fx-nudge 2s ease-in-out var(--fxc); display: inline-block; }
@keyframes fx-nudge { 0%, 100% { transform: translateX(0); } 60% { transform: translateX(7px); } }

/* ─ slide 1: assinatura ─ */
.carousel .slide:first-child .slide__body::after {
  content: ""; display: block; height: 5px; width: 36%;
  margin-top: clamp(14px, 2vw, 26px);
  background: var(--accent); transform-origin: center;
  animation: fx-sweep 6s cubic-bezier(.65, 0, .25, 1) var(--fxc);
}
@keyframes fx-sweep { 0%, 100% { transform: scaleX(.14); opacity: .6; } 50% { transform: scaleX(1); opacity: 1; } }
.carousel .slide:first-child .fx-orb { width: 80%; top: -18%; right: -20%; }

/* ─ stories: texto centrado ─ */
.story-single__body {
  justify-items: center !important; align-content: center !important;
  text-align: center !important; justify-self: stretch !important;
}
.story-single__body h1, .story-single__body .num, .story-single__body p { margin-inline: auto; }
.story-single--quote .story-single__body { border-left: none !important; padding-left: 0 !important; }

@media (prefers-reduced-motion: reduce) {
  .fx-orb, .slide__photo, .bg-photo, .slide--photo .photo, .num,
  h1 em, blockquote em, .arrow, .slide__cta, .story-single__cta { animation: none !important; }
  .carousel .slide:first-child .slide__body::after { animation: none !important; }
}
</style>

</head>
<body>
<section class="story-single story-single--type" aria-label="Story TechBody — ritmo_verao">
  <div class="fx-orb"></div>
  <div class="story-single__top">
    <span class="brand">TechBody</span>
  </div>
  <div class="story-single__body"><h1>Os resultados não tiram férias. 25 minutos mantêm o ritmo.</h1></div>
  <div class="story-single__bottom"><span></span><span class="story-single__cta">Link na bio</span></div>
</section>
</body>
</html>
