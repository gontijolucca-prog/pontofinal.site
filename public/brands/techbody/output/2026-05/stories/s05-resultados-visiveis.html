<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TechBody · resultados_visiveis · story</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;400;800;900&family=Fraunces:ital,wght@0,200;0,400;0,800;1,200;1,400;1,800&family=Manrope:wght@200;400;500;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #1a1a1a;
  --primary: #1a1a1a;
  --accent: #F49919;
  --text: #ffffff;
  --line: rgba(255,255,255,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a0c; color: var(--text); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }

.story-single {
  position: relative;
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  margin: 0 auto;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: clamp(40px, 6vw, 84px);
  overflow: hidden;
  font-family: 'Manrope', sans-serif;
}

.story-single::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,0.05), transparent 38%),
    radial-gradient(circle at 88% 92%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 42%);
  pointer-events: none;
}

.story-single__top,
.story-single__body,
.story-single__bottom { position: relative; z-index: 2; }

.story-single__top {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 65%, transparent);
}
.story-single__top .brand {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: clamp(15px, 1.8vw, 19px);
  letter-spacing: 0.01em;
  color: var(--accent);
  text-transform: none;
}

.story-single__body {
  display: grid; align-content: center; gap: clamp(18px, 2.4vw, 28px);
  width: 100%; max-width: 88%;
  justify-items: center; justify-self: center; text-align: center;
}
.story-single__body::before {
  content: ""; width: 52px; height: 4px; border-radius: 2px;
  background: var(--accent); justify-self: center;
}

.story-single--type h1 {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: clamp(40px, 8.4vw, 102px);
  line-height: 1.0; letter-spacing: -0.035em;
  text-transform: none;
  max-width: 15ch;
  text-wrap: balance;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.story-single--type h1 em { color: var(--accent); font-style: normal; font-weight: 900; }

.story-single__bottom {
  display: flex; justify-content: space-between; align-items: end;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 55%, transparent);
  gap: 16px;
}
</style>
</head>
<body>
<section class="story-single story-single--type" aria-label="Story TechBody — resultados_visiveis">

  <div class="story-single__top">
    <span class="brand">TechBody</span>
  </div>
  <div class="story-single__body"><h1><em>5 ou 6 sessões.</em> A diferença vê-se.</h1></div>
  <div class="story-single__bottom"></div>
</section>
</body>
