<!doctype html>
<html lang="pt-PT"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>O treino convencional só recruta 40%.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,200;0,400;0,800;1,200;1,400;1,800&family=Manrope:wght@200;400;500;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
<style>

:root {
  --bg: #1a1a1a;
  --accent: #d4773b;
  --text: #ffffff;
  --mute: color-mix(in srgb, var(--text) 55%, transparent);
  --line: color-mix(in srgb, var(--text) 12%, transparent);
  --font-display: 'Manrope', sans-serif;
  --font-body: 'Manrope', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #050507;
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.reel {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-height: 100vh;
  aspect-ratio: 9 / 16;
  margin: 0 auto;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
.reel__brand {
  position: absolute; top: clamp(20px, 3.4vw, 38px);
  left: clamp(20px, 3.4vw, 38px);
  z-index: 10;
  font-family: var(--font-display);
  font-weight: 700;
  font-style: normal;
  font-size: clamp(18px, 2.2vw, 26px);
  letter-spacing: -0.015em;
  color: var(--accent);
}
.reel__progress {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: rgba(255,255,255,0.06);
  z-index: 11;
}
.reel__progress::before {
  content: ""; position: absolute; inset: 0;
  background: var(--accent);
  transform-origin: left center;
  animation: reel-progress 15s linear infinite;
}
@keyframes reel-progress {
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}


.stage {
  position: absolute; inset: 0;
  display: grid; gap: clamp(20px, 3vw, 32px);
  padding: 130px 48px 70px;
  grid-template-rows: auto auto auto auto 1fr;
  align-content: center;
}
.label {
  font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--mute);
}
.bar { display: grid; gap: 10px; }
.bar__label {
  font-family: var(--font-display); font-weight: 500;
  font-size: clamp(20px, 2.6vw, 30px); letter-spacing: -0.018em;
}
.bar__pct {
  font-family: var(--font-display); font-weight: 200;
  font-size: clamp(56px, 11vw, 110px); line-height: 1;
  letter-spacing: -0.05em; color: var(--accent);
  opacity: 0;
  animation-duration: 15s; animation-iteration-count: infinite;
  animation-timing-function: ease;
}
.bar__pct--a { color: var(--mute); animation-name: pctA; }
.bar__pct--b { animation-name: pctB; }
@keyframes pctA { 0%, 18% { opacity: 0; } 26% { opacity: 1; } 92% { opacity: 1; } 96% { opacity: 0; } }
@keyframes pctB { 0%, 48% { opacity: 0; } 56% { opacity: 1; } 92% { opacity: 1; } 96% { opacity: 0; } }
.bar__rail {
  height: clamp(14px, 1.6vw, 18px);
  background: rgba(255,255,255,0.06);
  position: relative; overflow: hidden;
}
.bar__fill {
  position: absolute; inset: 0;
  background: var(--accent);
  transform-origin: left center;
  transform: scaleX(0);
  animation-duration: 15s;
  animation-iteration-count: infinite;
  animation-timing-function: cubic-bezier(0.6, 0, 0.2, 1);
}
.bar__fill--a { background: rgba(255,255,255,0.45); animation-name: barA; }
.bar__fill--b { animation-name: barB; }
@keyframes barA { 0%, 8% { transform: scaleX(0); } 26% { transform: scaleX(0.40); } 92% { transform: scaleX(0.40); } 96% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
@keyframes barB { 0%, 32% { transform: scaleX(0); } 56% { transform: scaleX(0.90); } 92% { transform: scaleX(0.90); } 96% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
.kicker {
  font-family: var(--font-display); font-weight: 500;
  font-size: clamp(22px, 3vw, 34px); line-height: 1.18;
  letter-spacing: -0.02em; max-width: 22ch;
  opacity: 0;
  animation: kicker 15s ease infinite;
}
@keyframes kicker { 0%, 72% { opacity: 0; transform: translateY(8px); } 80% { opacity: 1; transform: translateY(0); } 95% { opacity: 1; } 100% { opacity: 0; } }
.cta {
  align-self: end;
  font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--mute); padding-top: 24px;
  border-top: 1px solid var(--line);
  text-align: center;
}

</style></head>
<body>
<section class="reel" aria-label="Reel TechBody — O treino convencional só recruta 40%.">
  <div class="reel__progress"></div>
  <span class="reel__brand">TechBody</span>

<div class="stage">
  <span class="label">ACTIVAÇÃO MUSCULAR</span>
  <div class="bar bar--a">
    <span class="bar__label">Treino convencional</span>
    <span class="bar__pct bar__pct--a">40%</span>
    <div class="bar__rail"><div class="bar__fill bar__fill--a"></div></div>
  </div>
  <div class="bar bar--b">
    <span class="bar__label">EMS de corpo inteiro</span>
    <span class="bar__pct bar__pct--b">90%</span>
    <div class="bar__rail"><div class="bar__fill bar__fill--b"></div></div>
  </div>
  <h2 class="kicker">Mais do que dobra. Em metade do tempo.</h2>
  <span class="cta">Vê o método →</span>
</div>

</section>
</body></html>
