<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<title>TechBody · O seu tempo</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=family=Manrope:wght@200;300;400;600;800;900&family=JetBrains+Mono:wght@300;500;700&family=Titillium+Web:wght@200;400;600;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0c;font-family: 'Trillium Web',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  :root{
    --bg:#0a0a0c; --accent:#F69E1E; --accent-2:#ff9447;
    --tech:#5fb3ff; --tech-dim:rgba(95,179,255,0.18);
    --text:#fff; --text-dim:rgba(255,255,255,0.55); --text-faint:rgba(255,255,255,0.30);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  #root{width:100%;height:100%;position:relative;overflow:hidden;background:#0a0a0c}
  .grid-bg{position:absolute;inset:-80px;background-image:linear-gradient(rgba(95,179,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(95,179,255,0.05) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse at 50% 50%,black 30%,transparent 80%)}
  .depth{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(212,119,59,0.12) 0%,transparent 55%),radial-gradient(ellipse at 50% 85%,rgba(95,179,255,0.07) 0%,transparent 50%);pointer-events:none}
  .particles{position:absolute;inset:0;z-index:2;pointer-events:none}
  .pt{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-2);opacity:0.5}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(0,0,0,0.75) 100%);pointer-events:none;z-index:90}
  .grain{position:absolute;inset:0;opacity:0.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");z-index:91;pointer-events:none}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:200px 80px;opacity:0;z-index:5}
  .scene>div{text-align:center}

  /* S1 hook — pergunta */
  .wordmark{font-weight:200;font-size:88px;letter-spacing:-0.04em;line-height:0.9;text-align:center;margin-bottom:64px}
  .wordmark b{font-weight:900;background:linear-gradient(135deg,#ffa867 0%,#F69E1E 60%,#a85220 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .wordmark .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 30px var(--accent);vertical-align:middle;margin-left:6px;transform:translateY(-22px)}
  .hook-q{font-weight:200;font-size:130px;line-height:0.98;letter-spacing:-0.04em;text-align:center}
  .hook-q b{font-weight:900;color:var(--accent)}
  .scan-line{position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--tech),transparent);box-shadow:0 0 24px var(--tech-dim);z-index:6}

  /* S2 o dia desaparece */
  .clock{position:relative;width:340px;height:340px;margin:0 auto;border-radius:50%;border:4px solid rgba(212,119,59,0.45);box-shadow:0 0 60px rgba(212,119,59,0.12),inset 0 0 40px rgba(212,119,59,0.06)}
  .clock-tick{position:absolute;top:14px;left:50%;width:4px;height:22px;background:rgba(255,255,255,0.25);transform-origin:50% 156px;border-radius:2px}
  .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:6px}
  .hand-h{width:10px;height:92px;background:#fff;margin-left:-5px}
  .hand-m{width:6px;height:132px;background:var(--accent);box-shadow:0 0 14px var(--accent-2);margin-left:-3px}
  .clock-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent-2)}
  .day-words{display:flex;justify-content:center;gap:38px;margin-top:64px;font-family:var(--mono);font-size:26px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim)}
  .day-words span i{font-style:normal;color:var(--accent);margin-right:14px}
  .day-cap{margin-top:54px;font-weight:200;font-size:96px;line-height:0.98;letter-spacing:-0.04em;text-align:center}
  .day-cap b{font-weight:900;color:var(--accent)}

  /* S3 sessão 25 min — figura */
  .figure{position:relative;width:300px;height:640px;margin:0 auto}
  .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;background:#1c1c22;box-shadow:0 0 0 6px rgba(212,119,59,0.10)}
  .torso{position:absolute;top:112px;left:50%;transform:translateX(-50%);width:210px;height:280px;border-radius:90px 90px 46px 46px;background:linear-gradient(180deg,#23232c 0%,#15151a 100%);box-shadow:inset 0 0 0 2px rgba(212,119,59,0.25)}
  .legs{position:absolute;top:372px;left:50%;transform:translateX(-50%);width:240px;height:250px;background:linear-gradient(180deg,#1b1b20 0%,#101014 100%);border-radius:34px 34px 22px 22px}
  .suit-dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent-2)}
  .pulse-ring{position:absolute;top:150px;left:50%;width:420px;height:420px;border-radius:50%;border:2px solid var(--accent);transform:translateX(-50%);opacity:0}
  .min-badge{position:absolute;top:-20px;left:50%;transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border:2px solid rgba(212,119,59,0.6);border-radius:40px;font-family:var(--mono);font-size:24px;letter-spacing:0.16em;text-transform:uppercase;color:#fff;background:rgba(10,10,12,0.92);white-space:nowrap}
  .min-badge b{color:var(--accent);font-weight:700}
  .s3-cap{position:absolute;bottom:150px;left:80px;right:80px;text-align:center;font-weight:200;font-size:88px;line-height:0.95;letter-spacing:-0.04em}
  .s3-cap b{font-weight:900;color:var(--accent)}
  .s3-sub{position:absolute;bottom:96px;left:80px;right:80px;text-align:center;font-family:var(--mono);font-size:22px;color:var(--text-dim);letter-spacing:0.22em;text-transform:uppercase}

  /* S4 chega treina segue */
  .steps-h{text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:0.4em;color:var(--text-dim);text-transform:uppercase;margin-bottom:50px}
  .steps{display:flex;flex-direction:column;gap:34px;width:100%;max-width:860px}
  .step{font-weight:200;font-size:92px;line-height:1;letter-spacing:-0.03em;text-align:center}
  .step b{font-weight:900;color:var(--accent)}

  /* S5 close */
  .close-quote{font-weight:200;font-size:104px;line-height:0.98;letter-spacing:-0.04em;text-align:center}
  .close-quote b{font-weight:900;background:linear-gradient(135deg,#ffa867,#F69E1E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .close-sub{margin-top:36px;font-weight:300;font-size:40px;color:var(--text-dim);text-align:center}
  .close-cta{margin-top:60px;display:inline-block;padding:28px 56px;border:2px solid var(--accent);border-radius:18px;font-family:var(--mono);font-size:26px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent)}
  .close-mark{margin-top:42px;font-family:var(--mono);font-size:20px;color:var(--text-faint);letter-spacing:0.5em;text-transform:uppercase;text-align:center}

  .wipe{position:absolute;inset:0;background:var(--accent);z-index:80;transform:translateY(100%)}
  .wipe-2{background:#0a0a0c;z-index:81}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920">
  <div class="grid-bg" id="grid"></div>
  <div class="depth" id="depth"></div>
  <div class="particles" id="particles"></div>

  <!-- S1 hook: sem tempo para treinar? -->
  <div id="s1" class="scene">
    <div>
      <div class="wordmark"><span>tech</span><b>body</b><span class="dot"></span></div>
      <div class="hook-q">sem tempo<br>para <b>treinar</b>?</div>
    </div>
    <div class="scan-line" id="s1-scan" style="top:50%"></div>
  </div>

  <!-- S2 o dia desaparece -->
  <div id="s2" class="scene">
    <div>
      <div class="clock" id="clock">
        <div class="clock-tick" style="transform:rotate(0deg)"></div>
        <div class="clock-tick" style="transform:rotate(90deg)"></div>
        <div class="clock-tick" style="transform:rotate(180deg)"></div>
        <div class="clock-tick" style="transform:rotate(270deg)"></div>
        <div class="hand hand-h" id="hand-h"></div>
        <div class="hand hand-m" id="hand-m"></div>
        <div class="clock-core"></div>
      </div>
      <div class="day-words">
        <span id="dw1"><i>·</i>trabalho</span>
        <span id="dw2"><i>·</i>casa</span>
        <span id="dw3"><i>·</i>trânsito</span>
      </div>
      <div class="day-cap">o dia <b>desaparece</b></div>
    </div>
  </div>

  <!-- S3 sessão: 25 min, corpo inteiro, eletroestimulação -->
  <div id="s3" class="scene">
    <div class="pulse-ring" id="ring-1"></div>
    <div class="pulse-ring" id="ring-2"></div>
    <div class="figure" id="s3-fig">
      <div class="min-badge"><b>25 min</b> por sessão</div>
      <div class="head"></div>
      <div class="torso">
        <div class="suit-dot" style="top:46px;left:36px"></div>
        <div class="suit-dot" style="top:46px;right:36px"></div>
        <div class="suit-dot" style="top:120px;left:50%;transform:translateX(-50%)"></div>
        <div class="suit-dot" style="top:196px;left:36px"></div>
        <div class="suit-dot" style="top:196px;right:36px"></div>
      </div>
      <div class="legs"></div>
    </div>
    <div class="s3-cap">corpo inteiro, com<br><b>eletroestimulação</b></div>
    <div class="s3-sub">tecsuit · treino completo</div>
  </div>

  <!-- S4 chega, treina, segue -->
  <div id="s4" class="scene">
    <div>
      <div class="steps-h">a sessão</div>
      <div class="steps">
        <div class="step" id="st1"><b>chega</b></div>
        <div class="step" id="st2"><b>treina</b></div>
        <div class="step" id="st3">segue com o <b>seu dia</b></div>
      </div>
    </div>
  </div>

  <!-- S5 close -->
  <div id="s5" class="scene">
    <div>
      <div class="close-quote">marque a sua<br><b>sessão experimental</b></div>
      <div class="close-sub">nos estúdios TechBody</div>
      <div class="close-cta">link na bio</div>
      <div class="close-mark">@techbody_pt</div>
    </div>
  </div>

  <div class="wipe" id="w1"></div>
  <div class="wipe wipe-2" id="w2"></div>
  <div class="wipe" id="w3"></div>
  <div class="wipe wipe-2" id="w4"></div>

  <div class="vignette"></div>
  <div class="grain"></div>

  <audio id="narr" src="audio/narration.mp3" data-start="0" data-duration="23.2" data-track-index="9" data-volume="1"></audio>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({paused:true});
    // Início de cada cena (sincronizado com a narração) + total — gerados em timings.json.
    const S = [0.3, 2.15, 6.6, 12.93, 16.18];
    const TOTAL = 23.2;
    function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    const rand = rng(41);
    function wipeIn(el, fromY, toY, t, prev, next){
      tl.fromTo(el,{y:fromY},{y:'0%',duration:0.4,ease:'expo.in'},t-0.4);
      tl.set(prev,{opacity:0},t-0.05); tl.set(next,{opacity:1},t-0.05);
      tl.to(el,{y:toY,duration:0.4,ease:'expo.out',overwrite:'auto'},t);
    }

    // ===== AMBIENTE =====
    const reps=(start,cyc)=>Math.max(0,Math.floor((TOTAL-start)/cyc)-1);
    tl.to('#grid',{backgroundPositionX:'72px',backgroundPositionY:'72px',duration:8,ease:'none',repeat:reps(0,8)},0);
    tl.to('#depth',{opacity:0.6,duration:3.5,ease:'sine.inOut',yoyo:true,repeat:reps(0,3.5),overwrite:'auto'},0);
    const pf = document.getElementById('particles');
    for(let i=0;i<16;i++){
      const d=document.createElement('div');d.className='pt';
      const x=Math.round(rand()*1080), sz=4+Math.round(rand()*6), cyc=5+rand()*4, start=+(rand()*3).toFixed(2);
      d.style.left=x+'px';d.style.width=sz+'px';d.style.height=sz+'px';
      pf.appendChild(d);
      tl.fromTo(d,{y:1980,opacity:0},{y:-60,opacity:0.5,duration:cyc,ease:'none',repeat:reps(start,cyc)},start);
    }
    tl.set('#grid',{opacity:1},TOTAL); // âncora

    // ===== S1 hook (1.85s) =====
    tl.to('#s1',{opacity:1,duration:0.01},S[0]);
    tl.from('#s1 .wordmark',{y:36,opacity:0,duration:0.5,ease:'expo.out'},S[0]+0.05);
    tl.from('#s1 .hook-q',{y:44,opacity:0,duration:0.7,ease:'expo.out'},S[0]+0.2);
    tl.from('#s1 .hook-q b',{scale:1.14,duration:0.7,ease:'power3.out'},S[0]+0.5);
    tl.fromTo('#s1-scan',{top:'16%',opacity:0},{top:'84%',opacity:1,duration:1.3,ease:'sine.inOut'},S[0]+0.3);

    // ===== S2 o dia desaparece (4.45s) =====
    wipeIn('#w1','100%','-100%',S[1],'#s1','#s2');
    tl.from('#s2 .clock',{scale:0.6,opacity:0,duration:0.7,ease:'expo.out'},S[1]+0.1);
    tl.fromTo('#hand-h',{rotation:40},{rotation:400,duration:3.6,ease:'power1.inOut'},S[1]+0.4);
    tl.fromTo('#hand-m',{rotation:0},{rotation:1080,duration:3.6,ease:'power1.inOut'},S[1]+0.4);
    tl.from('#dw1',{y:20,opacity:0,duration:0.5,ease:'expo.out'},S[1]+0.7);
    tl.from('#dw2',{y:20,opacity:0,duration:0.5,ease:'expo.out'},S[1]+1.1);
    tl.from('#dw3',{y:20,opacity:0,duration:0.5,ease:'expo.out'},S[1]+1.5);
    tl.from('#s2 .day-cap',{y:28,opacity:0,duration:0.7,ease:'expo.out'},S[1]+2.2);
    tl.from('#s2 .day-cap b',{scale:1.1,duration:0.7,ease:'power3.out'},S[1]+2.6);

    // ===== S3 sessão 25 min (6.33s) =====
    wipeIn('#w2','-100%','100%',S[2],'#s2','#s3');
    tl.from('#s3 .figure',{y:60,opacity:0,duration:0.9,ease:'expo.out'},S[2]+0.1);
    tl.from('#s3 .min-badge',{y:-20,opacity:0,duration:0.6,ease:'back.out(1.8)'},S[2]+0.8);
    tl.from('#s3 .suit-dot',{scale:0,opacity:0,duration:0.4,stagger:0.1,ease:'back.out(2.4)'},S[2]+0.7);
    tl.to('#s3 .suit-dot',{scale:1.3,duration:0.5,ease:'sine.inOut',yoyo:true,repeat:9,stagger:0.06,overwrite:'auto'},S[2]+1.5);
    tl.fromTo('#ring-1',{scale:0.4,opacity:0.7},{scale:1.4,opacity:0,duration:1.8,ease:'sine.out',repeat:2},S[2]+1.2);
    tl.fromTo('#ring-2',{scale:0.4,opacity:0.5},{scale:1.6,opacity:0,duration:2.0,ease:'sine.out',repeat:2},S[2]+1.7);
    tl.to('#s3-fig',{y:-14,duration:1.8,ease:'sine.inOut',yoyo:true,repeat:2,overwrite:'auto'},S[2]+0.7);
    tl.from('#s3 .s3-cap',{y:28,opacity:0,duration:0.8,ease:'expo.out'},S[2]+2.6);
    tl.from('#s3 .s3-cap b',{scale:1.1,duration:0.8,ease:'power3.out'},S[2]+3.0);
    tl.from('#s3 .s3-sub',{y:14,opacity:0,duration:0.6},S[2]+3.5);

    // ===== S4 chega treina segue (3.25s) =====
    wipeIn('#w3','100%','-100%',S[3],'#s3','#s4');
    tl.from('#s4 .steps-h',{y:18,opacity:0,duration:0.5},S[3]+0.05);
    tl.from('#st1',{x:-50,opacity:0,duration:0.55,ease:'expo.out'},S[3]+0.35);
    tl.from('#st2',{x:-50,opacity:0,duration:0.55,ease:'expo.out'},S[3]+0.85);
    tl.from('#st3',{x:-50,opacity:0,duration:0.55,ease:'expo.out'},S[3]+1.35);

    // ===== S5 close (7.0s) =====
    wipeIn('#w4','-100%','100%',S[4],'#s4','#s5');
    tl.from('#s5 .close-quote',{y:50,opacity:0,duration:0.9,ease:'expo.out'},S[4]+0.1);
    tl.from('#s5 .close-quote b',{scale:1.1,duration:0.9,ease:'power3.out'},S[4]+0.55);
    tl.from('#s5 .close-sub',{y:16,opacity:0,duration:0.6},S[4]+1.05);
    tl.from('#s5 .close-cta',{scale:0.8,opacity:0,duration:0.5,ease:'back.out(2)'},S[4]+1.3);
    tl.to('#s5 .close-cta',{scale:1.06,duration:0.5,ease:'sine.inOut',yoyo:true,repeat:3,overwrite:'auto'},S[4]+2.0);
    tl.from('#s5 .close-mark',{y:14,opacity:0,duration:0.6},S[4]+1.7);
    tl.to('#s5',{opacity:0,duration:0.5,ease:'power2.in'},TOTAL-0.5);

    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
