<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;400;700;800;900&family=Manrope:wght@200;400;500;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0a0c; --bg-2:#161513; --accent:#F49919; --accent-2:#ff9447; --text:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1080px;height:1920px;background:var(--bg);}
.story{
  position:relative;width:1080px;height:1920px;background:var(--bg);color:var(--text);
  overflow:hidden;font-family:'Manrope',sans-serif;
  display:grid;grid-template-rows:auto 1fr auto;padding:96px 84px;
}
/* foto de fundo + overlay escuro para legibilidade do texto centrado */
.bgphoto{position:absolute;inset:0;z-index:0;background:url('p_franchising.png') center/cover no-repeat;}
.bgphoto::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(10,10,12,.48) 0%, rgba(10,10,12,.72) 42%, rgba(10,10,12,.84) 72%, #0a0a0c 100%);}
.story::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(circle at 86% 90%, rgba(212,119,59,.28), transparent 46%);}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(ellipse at 50% 50%, transparent 32%, rgba(0,0,0,.72) 100%);}
.grain{position:absolute;inset:0;z-index:1;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.top,.body,.bottom{position:relative;z-index:2;}
.top{display:flex;justify-content:space-between;align-items:baseline;}
.brand{font-family:'Manrope';font-weight:800;font-size:30px;letter-spacing:-.01em;color:var(--accent);}
.eyebrow{font-family:'JetBrains Mono';font-size:20px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.body{place-self:center;display:grid;gap:34px;justify-items:center;text-align:center;max-width:880px;}
.dash{width:84px;height:6px;background:var(--accent);}
h1{font-family:'Manrope';font-weight:800;font-size:104px;line-height:1.03;letter-spacing:-.03em;text-wrap:balance;}
h1 em{color:var(--accent);font-style:normal;}
.sub{font-family:'Manrope';font-weight:400;font-size:38px;line-height:1.3;letter-spacing:-.01em;color:rgba(255,255,255,.86);max-width:28ch;text-wrap:balance;}
.bottom{display:flex;flex-direction:column;align-items:center;gap:30px;}
.cta{display:inline-block;background:var(--accent);color:#0a0a0c;padding:22px 38px;font-family:'Barlow';font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
.handle{font-family:'JetBrains Mono';font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6);}
</style>
</head>
<body>
<section class="story">
  <div class="bgphoto"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="top">
    <span class="brand">TechBody</span>
    <span class="eyebrow">Franchising</span>
  </div>
  <div class="body">
    <div class="dash"></div>
    <h1>Integra a TechBody no teu estúdio ou no teu <em>espaço.</em></h1>
    <p class="sub">Tens uma clínica, estúdio de PT ou espaço de saúde e bem-estar? Sabe como a eletroestimulação pode aumentar a tua receita.</p>
  </div>
  <div class="bottom">
    <span class="cta">Sê franchisado</span>
    <span class="handle">@techbody_pt</span>
  </div>
</section>
</body>
</html>
