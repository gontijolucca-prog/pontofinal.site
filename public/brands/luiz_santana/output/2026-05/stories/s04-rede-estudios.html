<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Luiz Santana · rede_estudios · story</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;400;800;900&family=Fraunces:ital,wght@0,200;0,400;0,800;1,200;1,400;1,800&family=Manrope:wght@200;400;500;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #1a1a1a;
  --primary: #1a1a1a;
  --accent: #d4773b;
  --text: #ffffff;
  --line: rgba(255,255,255,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a0c; color: var(--text); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }

/* Single story = full 9:16 poster, no scrolling, fits Instagram story 1080×1920 */
.story-single {
  position: relative;
  /* Force 9:16 box even when the viewport itself is wider/shorter. */
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  margin: 0 auto;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  font-family: 'Manrope', sans-serif;
  padding: 0; /* posicionamento absoluto cuida do espaçamento interno */
}

/* Atmospheric backdrop */
.story-single::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,0.05), transparent 38%),
    radial-gradient(circle at 88% 92%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 42%);
  pointer-events: none;
}

.bg-photo {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  z-index: 0;
}
.bg-photo::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 35%, transparent) 0%,
    color-mix(in srgb, var(--bg) 78%, transparent) 60%,
    var(--bg) 100%);
}

.story-single__top,
.story-single__body,
.story-single__bottom { position: relative; z-index: 2; }

.story-single__top {
  position: absolute;
  top: clamp(20px, 3.4%, 60px);
  left: clamp(20px, 4%, 60px);
  right: clamp(20px, 4%, 60px);
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 65%, transparent);
}
.story-single__top .brand {
  font-family: 'Manrope', sans-serif; font-weight: 700;
  font-size: clamp(16px, 1.9vw, 20px);
  letter-spacing: -0.01em;
  color: var(--accent);
  text-transform: none;
}

.story-single__body {
  position: absolute;
  top: 7%;
  left: clamp(20px, 4%, 60px);
  right: clamp(20px, 4%, 60px);
  height: 26%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  /* TERÇO SUPERIOR — texto full-width */
}

/* placeholder visual da sondagem Instagram — cobre terço médio + parte do inferior.
   Quando o story for publicado, o sticker real de Enquete fica por cima e tapa isto. */
.poll-placeholder {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 36%;
  max-width: 380px;
  background: rgba(255,255,255,0.94);
  color: #0a0a0c;
  border-radius: clamp(10px, 1.4vw, 16px);
  padding: clamp(8px, 1vh, 12px) clamp(10px, 1.4vw, 16px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.30);
  display: flex; flex-direction: column;
  gap: clamp(4px, 0.7vh, 8px);
  font-family: 'Manrope', sans-serif;
  /* sticker-sized: extra pequeno para o Luiz tapar com o sticker real do IG */
}
.poll-placeholder__label { display: none; }
.poll-placeholder__q {
  font-family: 'Manrope', sans-serif;
  font-weight: 600;
  font-size: clamp(11px, 1.4vw, 15px);
  line-height: 1.15;
  letter-spacing: -0.008em;
  text-align: center;
  color: #0a0a0c;
}
.poll-placeholder__opts {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: clamp(4px, 0.6vw, 8px);
}
.poll-placeholder__opt {
  background: rgba(10,10,12,0.05);
  border: 1px solid rgba(10,10,12,0.10);
  border-radius: clamp(6px, 0.8vw, 10px);
  padding: clamp(4px, 0.6vh, 6px) clamp(4px, 0.8vw, 8px);
  font-family: 'Manrope', sans-serif;
  font-weight: 500;
  font-size: clamp(10px, 1.2vw, 13px);
  color: #0a0a0c;
  text-align: center;
  letter-spacing: -0.003em;
}
.story-single__bottom { z-index: 2; }


/* Headline variants — clean Manrope for dark brand; italic Fraunces stays for soft brand */
.story-single--type h1 {
  font-family: 'Manrope', sans-serif;
  font-weight: 600;
  font-size: clamp(30px, 5.2vw, 64px);
  line-height: 1.08;
  letter-spacing: -0.022em;
  text-transform: none;
  text-wrap: balance;
  max-width: 100%;
}

.story-single--type-soft h1 {
  font-family: 'Fraunces', serif;
  font-weight: 200; font-style: italic;
  font-size: clamp(44px, 9.4vw, 132px);
  line-height: 0.96; letter-spacing: -0.025em;
  max-width: 16ch;
}
.story-single--type-soft h1 em { color: var(--accent); font-style: italic; font-weight: 800; }

.story-single--num .num {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-style: italic;
  font-size: clamp(160px, 32vw, 320px);
  line-height: 0.86; letter-spacing: -0.06em;
  color: var(--accent);
}
.story-single--num h1 {
  font-family: 'Manrope', sans-serif;
  font-weight: 500;
  font-size: clamp(22px, 3.2vw, 38px);
  line-height: 1.15; letter-spacing: -0.018em;
  text-transform: none;
  max-width: 22ch;
}
.story-single--num-soft .num {
  font-family: 'Fraunces', serif;
  font-style: italic; font-weight: 800;
  color: var(--accent);
}
.story-single--num-soft h1 {
  font-family: 'Fraunces', serif;
  font-style: italic; font-weight: 400;
  text-transform: none;
  letter-spacing: -0.02em;
}

.story-single--quote blockquote {
  font-family: 'Fraunces', serif; font-style: italic;
  font-weight: 200;
  font-size: clamp(34px, 6.4vw, 78px);
  line-height: 1.12; letter-spacing: -0.022em;
  color: var(--text);
  max-width: 18ch;
}
.story-single--quote::before {
  content: "";
  position: absolute; left: clamp(40px, 6vw, 84px); top: 38%;
  width: 4px; height: 24vh; background: var(--accent);
  z-index: 1;
}
.story-single--quote .story-single__body { padding-left: clamp(20px, 3vw, 36px); }
.story-single--quote cite {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; font-style: normal;
  color: color-mix(in srgb, var(--text) 60%, transparent);
}

.story-single__bottom {
  position: absolute;
  bottom: clamp(20px, 3.4%, 60px);
  left: clamp(20px, 4%, 60px);
  right: clamp(20px, 4%, 60px);
  display: flex; justify-content: space-between; align-items: end;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: color-mix(in srgb, var(--text) 55%, transparent);
  gap: 16px;
}
.story-single__cta {
  display: inline-block;
  background: var(--accent); color: #0a0a0c;
  padding: 10px 18px;
  font-family: 'Barlow', sans-serif; font-weight: 800;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  line-height: 1;
}
</style>
</head>
<body>
<section class="story-single story-single--type" aria-label="Story Luiz Santana — rede_estudios">
  <div class="bg-photo" style="background-image:url('../../../assets/photos/magnific_a7.-seated-confidence-edi_2964371960.jpg')"></div>
  <div class="story-single__top">
    <span class="brand">Luiz Santana</span>
  </div>
  <div class="story-single__body"><h1>Preferes treinar em estúdio ou em casa?</h1></div>
  
  <aside class="poll-placeholder" aria-label="placeholder sondagem Instagram">
    <span class="poll-placeholder__label">enquete · placeholder</span>
    <p class="poll-placeholder__q">Onde preferes treinar?</p>
    <div class="poll-placeholder__opts">
      <div class="poll-placeholder__opt">Estúdio</div>
      <div class="poll-placeholder__opt">Em casa</div>
    </div>
  </aside>
  <div class="story-single__bottom"></div>
</section>
</body>
</html>
