<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<title>TechBody U · Treinador Verão</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,800&family=Manrope:wght@300;500;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#F2EDE4;font-family:'Manrope',system-ui,sans-serif;color:#14160F;-webkit-font-smoothing:antialiased}
  :root{
    --cream:#F2EDE4; --cream-2:#E8DECF;
    --ink:#14160F; --ink-dim:rgba(20,22,15,0.60); --ink-faint:rgba(20,22,15,0.30);
    --terra:#C36F49; --terra-2:#A8553A; --terra-light:#E1A180;
    --serif:'Fraunces',Georgia,serif;
  }
  #root{width:100%;height:100%;position:relative;overflow:hidden;background:var(--cream)}
  .paper{position:absolute;inset:-60px;background:radial-gradient(ellipse at 30% 20%,rgba(195,111,73,0.10) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(195,111,73,0.07) 0%,transparent 55%);pointer-events:none}
  .particles{position:absolute;inset:0;z-index:2;pointer-events:none}
  .pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--terra);opacity:0.35}
  .grain{position:absolute;inset:0;opacity:0.08;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");z-index:91;pointer-events:none}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(168,85,58,0.10) 100%);pointer-events:none;z-index:90}

  .mark-top{position:absolute;top:54px;left:54px;right:54px;display:flex;justify-content:space-between;align-items:center;z-index:10;font-size:18px;letter-spacing:0.32em;text-transform:uppercase;color:var(--ink-dim);font-weight:500}
  .mark-bot{position:absolute;bottom:54px;left:54px;right:54px;display:flex;justify-content:space-between;align-items:center;z-index:10;font-size:16px;letter-spacing:0.36em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
  .mark-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--terra);margin-right:10px;vertical-align:middle}
  .mark-rule{height:1px;flex:1;margin:0 22px;background:var(--ink-faint)}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:200px 80px;opacity:0;z-index:5}
  .scene>div{text-align:center}

  /* S1 hook */
  .wm{font-family:var(--serif);font-weight:300;font-size:130px;line-height:0.85;letter-spacing:-0.04em;text-align:center;color:var(--ink);margin-bottom:44px}
  .wm-u{font-weight:800;color:var(--terra);font-style:italic}
  .hook{font-family:var(--serif);font-weight:300;font-size:108px;line-height:0.98;letter-spacing:-0.04em;text-align:center;color:var(--ink)}
  .hook em{font-style:italic;font-weight:800;color:var(--terra)}
  .hook-sub{margin-top:36px;font-size:24px;letter-spacing:0.32em;color:var(--ink-dim);text-transform:uppercase;font-weight:600;text-align:center}
  .underline{display:block;width:140px;height:3px;background:var(--terra);margin:34px auto 0}

  /* S1 sun */
  .sun{position:absolute;top:280px;left:50%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;background:var(--terra);box-shadow:0 0 0 2px var(--terra-2);margin-bottom:40px;opacity:0}
  .sun::before{content:'';position:absolute;inset:50%;width:180px;height:2px;background:linear-gradient(90deg,transparent,var(--terra),transparent);left:-50%;top:-50%;transform:translateY(-50%)}
  .sun::after{content:'';position:absolute;inset:50%;width:2px;height:180px;background:linear-gradient(180deg,transparent,var(--terra),transparent);top:-50%;left:-50%;transform:translateX(-50%)}

  /* S2 phone mockup */
  .phone{width:480px;height:920px;border-radius:56px;background:linear-gradient(170deg,#fff 0%,#F3EADF 100%);border:6px solid rgba(20,22,15,0.10);box-shadow:0 50px 120px rgba(168,85,58,0.18);position:relative;overflow:hidden}
  .phone::before{content:'';position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:rgba(20,22,15,0.12);border-radius:18px;z-index:3}
  .app{position:absolute;inset:20px;border-radius:42px;background:linear-gradient(180deg,#FBF6EE 0%,#EFE4D4 100%);padding:80px 40px 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .app-h{font-size:20px;letter-spacing:0.32em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
  .app-stat{font-family:var(--serif);font-weight:800;font-size:210px;line-height:0.85;color:var(--terra)}
  .app-stat small{font-size:60px}
  .app-freq{font-family:var(--serif);font-style:italic;font-weight:800;font-size:44px;color:var(--terra-2);text-align:center;line-height:1.1}
  .app-play{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--terra),var(--terra-2));display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(168,85,58,0.3)}
  .app-play::after{content:'';width:0;height:0;border-left:38px solid #fff;border-top:24px solid transparent;border-bottom:24px solid transparent;margin-left:9px}
  .phone-cap{position:absolute;bottom:120px;left:80px;right:80px;text-align:center;font-family:var(--serif);font-weight:300;font-size:96px;line-height:0.95;letter-spacing:-0.04em;color:var(--ink)}
  .phone-cap em{font-style:italic;font-weight:800;color:var(--terra)}

  /* S3 stat */
  .stat-big{font-family:var(--serif);font-weight:800;font-size:280px;line-height:0.82;letter-spacing:-0.05em;color:var(--terra);text-align:center}
  .stat-big small{font-size:100px}
  .stat-rule{width:160px;height:3px;background:var(--ink);margin:40px auto 0}
  .stat-cap{margin-top:44px;font-family:var(--serif);font-weight:300;font-size:60px;line-height:1.1;text-align:center;color:var(--ink)}
  .stat-cap em{font-style:italic;font-weight:800;color:var(--terra)}

  /* S4 progress bars */
  .bar-chart{display:flex;justify-content:center;align-items:flex-end;gap:24px;height:320px;margin-bottom:80px}
  .bar{width:56px;background:linear-gradient(180deg,var(--terra),var(--terra-2));border-radius:8px 8px 0 0;min-height:40px;box-shadow:0 8px 20px rgba(195,111,73,0.2)}
  .bar-1{height:60px}
  .bar-2{height:120px}
  .bar-3{height:180px}
  .bar-4{height:240px}
  .bar-5{height:300px}
  .bars-cap{font-family:var(--serif);font-weight:300;font-size:60px;line-height:1.1;text-align:center;color:var(--ink)}
  .bars-cap em{font-style:italic;font-weight:800;color:var(--terra)}

  /* S5 close */
  .close{font-family:var(--serif);font-weight:300;font-size:118px;line-height:0.98;letter-spacing:-0.04em;text-align:center;color:var(--ink)}
  .close em{font-style:italic;font-weight:800;color:var(--terra)}
  .close-sub{margin-top:34px;font-size:40px;color:var(--ink-dim);text-align:center;font-weight:500}
  .close-cta{margin-top:58px;display:inline-block;padding:26px 54px;border:2px solid var(--terra);border-radius:16px;font-size:24px;letter-spacing:0.16em;text-transform:uppercase;color:var(--terra-2);font-weight:700}
  .close-handle{margin-top:40px;text-align:center;font-size:22px;letter-spacing:0.5em;color:var(--ink-faint);text-transform:uppercase;font-weight:700}

  .ink-wipe{position:absolute;inset:0;background:var(--terra);z-index:80;transform:translateX(-100%)}
  .ink-wipe-2{background:var(--ink)}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920">
  <div class="paper" id="paper"></div>
  <div class="particles" id="particles"></div>

  <div id="s1" class="scene">
    <div>
      <div class="sun" id="s1-sun"></div>
      <div class="wm">tech<span class="wm-u">body U</span></div>
      <div class="hook">este verão, o seu treinador<br>vai <em>consigo</em></div>
      <span class="underline"></span>
    </div>
  </div>

  <div id="s2" class="scene">
    <div>
      <div class="phone">
        <div class="app">
          <div class="app-h">na aplicação</div>
          <div style="font-family:var(--serif);font-weight:300;font-size:80px;color:var(--ink);text-align:center">planos<br>personalizados</div>
          <div class="app-play" id="s2-play"></div>
        </div>
      </div>
      <div class="phone-cap">aulas que guiam<br>cada <em>treino</em></div>
    </div>
  </div>

  <div id="s3" class="scene">
    <div>
      <div class="stat-big">25<small>min</small></div>
      <div class="stat-rule"></div>
      <div class="stat-cap">3x por semana · onde <em>estiver</em></div>
    </div>
  </div>

  <div id="s4" class="scene">
    <div>
      <div class="bar-chart">
        <div class="bar bar-1" id="bar-1"></div>
        <div class="bar bar-2" id="bar-2"></div>
        <div class="bar bar-3" id="bar-3"></div>
        <div class="bar bar-4" id="bar-4"></div>
        <div class="bar bar-5" id="bar-5"></div>
      </div>
      <div class="bars-cap">o progresso fica <em>registado</em></div>
    </div>
  </div>

  <div id="s5" class="scene">
    <div>
      <div class="close">conheça a <em>TechBody U</em></div>
      <div class="close-sub">link na bio</div>
      <div class="close-cta">link na bio</div>
      <div class="close-handle">@techbody_u</div>
    </div>
  </div>

  <div class="ink-wipe" id="w1"></div><div class="ink-wipe ink-wipe-2" id="w2"></div><div class="ink-wipe" id="w3"></div><div class="ink-wipe ink-wipe-2" id="w4"></div>

  <div class="vignette"></div>
  <div class="grain"></div>

  <audio id="narr" src="audio/narration.mp3" data-start="0" data-duration="22.44" data-track-index="9" data-volume="1"></audio>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({paused:true});
    const S = [0.3, 3.25, 8.85, 12.94, 17.01];
    const TOTAL = 22.44;
    function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    const rand = rng(201);
    function wipeIn(el,fromX,toX,t,prev,next){tl.fromTo(el,{x:fromX},{x:'0%',duration:0.4,ease:'expo.in'},t-0.4);tl.set(prev,{opacity:0},t-0.05);tl.set(next,{opacity:1},t-0.05);tl.to(el,{x:toX,duration:0.4,ease:'expo.out',overwrite:'auto'},t);}

    // ===== AMBIENTE =====
    const reps=(start,cyc)=>Math.max(0,Math.floor((TOTAL-start)/cyc)-1);
    tl.to('#paper',{xPercent:3,yPercent:-2,duration:6,ease:'sine.inOut',yoyo:true,repeat:reps(0,6),overwrite:'auto'},0);
    const pf=document.getElementById('particles');
    for(let i=0;i<14;i++){const d=document.createElement('div');d.className='pt';const x=Math.round(rand()*1080),sz=5+Math.round(rand()*6),cyc=6+rand()*4,start=+(rand()*3).toFixed(2);d.style.left=x+'px';d.style.width=sz+'px';d.style.height=sz+'px';pf.appendChild(d);tl.fromTo(d,{y:1980,opacity:0},{y:-60,opacity:0.4,duration:cyc,ease:'none',repeat:reps(start,cyc)},start);}
    tl.set('#paper',{opacity:1},TOTAL);

    // ===== S1 HOOK =====
    tl.to('#s1',{opacity:1,duration:0.01},S[0]);
    tl.from('#s1-sun',{y:40,opacity:0,duration:0.7,ease:'expo.out'},S[0]+0.05);
    tl.from('#s1 .wm',{y:54,opacity:0,duration:0.8,ease:'expo.out'},S[0]+0.3);
    tl.from('#s1 .wm-u',{x:40,opacity:0,duration:0.6,ease:'back.out(1.5)'},S[0]+0.6);
    tl.from('#s1 .hook',{y:40,opacity:0,duration:0.8,ease:'expo.out'},S[0]+1.0);
    tl.from('#s1 .hook em',{scale:1.14,duration:0.8,ease:'power3.out'},S[0]+1.3);
    tl.from('#s1 .underline',{scaleX:0,duration:0.6,ease:'expo.out'},S[0]+1.7);

    // ===== WIPE S1→S2 =====
    wipeIn('#w1','-100%','100%',S[1],'#s1','#s2');
    tl.from('#s2 .phone',{y:60,opacity:0,scale:0.93,duration:0.9,ease:'expo.out'},S[1]+0.1);
    tl.from('#s2 .app-h',{y:12,opacity:0,duration:0.5},S[1]+0.55);
    tl.from('#s2 .app > div:nth-child(2)',{scale:0.6,opacity:0,duration:0.8,ease:'expo.out'},S[1]+0.8);
    tl.from('#s2-play',{scale:0,opacity:0,duration:0.5,ease:'back.out(2.2)'},S[1]+1.4);
    tl.to('#s2-play',{scale:1.08,duration:0.8,ease:'sine.inOut',yoyo:true,repeat:2,overwrite:'auto'},S[1]+1.9);
    tl.from('#s2 .phone-cap',{y:24,opacity:0,duration:0.7,ease:'expo.out'},S[1]+1.7);
    tl.from('#s2 .phone-cap em',{scale:1.12,duration:0.7,ease:'power3.out'},S[1]+2.1);

    // ===== WIPE S2→S3 =====
    wipeIn('#w2','100%','-100%',S[2],'#s2','#s3');
    tl.from('#s3 .stat-big',{scale:0.4,opacity:0,duration:0.9,ease:'expo.out'},S[2]+0.1);
    tl.from('#s3 .stat-big small',{scale:1.2,duration:0.7,ease:'power3.out'},S[2]+0.6);
    tl.from('#s3 .stat-rule',{scaleX:0,duration:0.6,ease:'power2.out'},S[2]+0.95);
    tl.from('#s3 .stat-cap',{y:24,opacity:0,duration:0.7,ease:'expo.out'},S[2]+1.3);
    tl.from('#s3 .stat-cap em',{scale:1.12,duration:0.7,ease:'power3.out'},S[2]+1.7);

    // ===== WIPE S3→S4 =====
    wipeIn('#w3','-100%','100%',S[3],'#s3','#s4');
    tl.from('#bar-1',{height:20,opacity:0,duration:0.5,ease:'expo.out'},S[3]+0.1);
    tl.from('#bar-2',{height:20,opacity:0,duration:0.5,ease:'expo.out'},S[3]+0.3);
    tl.from('#bar-3',{height:20,opacity:0,duration:0.5,ease:'expo.out'},S[3]+0.5);
    tl.from('#bar-4',{height:20,opacity:0,duration:0.5,ease:'expo.out'},S[3]+0.7);
    tl.from('#bar-5',{height:20,opacity:0,duration:0.5,ease:'expo.out'},S[3]+0.9);
    tl.from('#s4 .bars-cap',{y:24,opacity:0,duration:0.7,ease:'expo.out'},S[3]+1.6);
    tl.from('#s4 .bars-cap em',{scale:1.12,duration:0.7,ease:'power3.out'},S[3]+2.0);

    // ===== WIPE S4→S5 =====
    wipeIn('#w4','100%','-100%',S[4],'#s4','#s5');
    tl.from('#s5 .close',{y:50,opacity:0,duration:0.8,ease:'expo.out'},S[4]+0.1);
    tl.from('#s5 .close em',{scale:1.12,duration:0.8,ease:'power3.out'},S[4]+0.5);
    tl.from('#s5 .close-sub',{y:16,opacity:0,duration:0.6},S[4]+1.0);
    tl.from('#s5 .close-cta',{scale:0.8,opacity:0,duration:0.6,ease:'back.out(2)'},S[4]+1.5);
    tl.to('#s5 .close-cta',{scale:1.06,duration:0.7,ease:'sine.inOut',yoyo:true,repeat:2,overwrite:'auto'},S[4]+2.2);
    tl.from('#s5 .close-handle',{y:14,opacity:0,duration:0.6},S[4]+1.9);
    tl.to('#s5',{opacity:0,duration:0.5,ease:'power2.in'},TOTAL-0.5);

    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
