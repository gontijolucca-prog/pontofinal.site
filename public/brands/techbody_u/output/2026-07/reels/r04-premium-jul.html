<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<title>TechBody U · Premium</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,800&family=Manrope:wght@300;500;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#F2EDE4;font-family:'Manrope',system-ui,sans-serif;color:#14160F;-webkit-font-smoothing:antialiased}
  :root{
    --cream:#F2EDE4; --cream-2:#E8DECF;
    --ink:#14160F; --ink-dim:rgba(20,22,15,0.60); --ink-faint:rgba(20,22,15,0.30);
    --terra:#C36F49; --terra-2:#A8553A; --terra-light:#E1A180;
    --serif:'Fraunces',Georgia,serif;
  }
  #root{width:100%;height:100%;position:relative;overflow:hidden;background:var(--cream)}
  .paper{position:absolute;inset:-60px;background:radial-gradient(ellipse at 30% 20%,rgba(195,111,73,0.10) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(195,111,73,0.07) 0%,transparent 55%);pointer-events:none}
  .particles{position:absolute;inset:0;z-index:2;pointer-events:none}
  .pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--terra);opacity:0.35}
  .grain{position:absolute;inset:0;opacity:0.08;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");z-index:91;pointer-events:none}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(168,85,58,0.10) 100%);pointer-events:none;z-index:90}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:200px 80px;opacity:0;z-index:5}
  .scene>div{text-align:center}

  /* S1 stat hook */
  .s1-stat{font-family:var(--serif);font-weight:800;font-size:240px;line-height:0.80;letter-spacing:-0.05em;text-align:center;color:var(--terra);margin-bottom:20px}
  .s1-unit{font-family:var(--serif);font-weight:300;font-size:52px;line-height:1.1;letter-spacing:-0.02em;text-align:center;color:var(--ink);margin-bottom:40px}
  .s1-hook{font-family:var(--serif);font-weight:300;font-size:96px;line-height:0.98;letter-spacing:-0.04em;text-align:center;color:var(--ink)}
  .s1-hook em{font-style:italic;font-weight:800;color:var(--terra)}

  /* S2 lista */
  .s2-header{font-size:20px;letter-spacing:0.32em;text-transform:uppercase;color:var(--ink-dim);font-weight:700;margin-bottom:50px}
  .s2-list{display:flex;flex-direction:column;gap:36px;width:100%;max-width:900px}
  .s2-item{font-family:var(--serif);font-weight:300;font-size:80px;line-height:1.05;letter-spacing:-0.03em;text-align:center;color:var(--ink)}
  .s2-item em{font-style:italic;font-weight:800;color:var(--terra)}

  /* S3 phone */
  .phone{width:480px;height:920px;border-radius:56px;background:linear-gradient(170deg,#fff 0%,#F3EADF 100%);border:6px solid rgba(20,22,15,0.10);box-shadow:0 50px 120px rgba(168,85,58,0.18);position:relative;overflow:hidden}
  .phone::before{content:'';position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:rgba(20,22,15,0.12);border-radius:18px;z-index:3}
  .video-call{position:absolute;inset:20px;border-radius:42px;background:linear-gradient(180deg,#FBF6EE 0%,#EFE4D4 100%);padding:60px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .avatar-circle{width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,var(--terra),var(--terra-2));display:flex;align-items:center;justify-content:center;font-size:80px;color:#fff}
  .call-buttons{display:flex;gap:32px;justify-content:center}
  .call-btn{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#CCCCCC,#999999);display:flex;align-items:center;justify-content:center}
  .call-btn.active{background:linear-gradient(135deg,var(--terra),var(--terra-2))}
  .phone-cap{position:absolute;bottom:120px;left:80px;right:80px;text-align:center;font-family:var(--serif);font-weight:300;font-size:96px;line-height:0.95;letter-spacing:-0.04em;color:var(--ink)}
  .phone-cap em{font-style:italic;font-weight:800;color:var(--terra)}

  /* S4 statement */
  .stmt{font-family:var(--serif);font-weight:300;font-size:110px;line-height:0.98;letter-spacing:-0.04em;text-align:center;color:var(--ink)}
  .stmt em{font-style:italic;font-weight:800;color:var(--terra)}
  .stmt-rule{width:160px;height:3px;background:var(--terra);margin:38px auto 0}

  /* S5 CTA */
  .close{font-family:var(--serif);font-weight:300;font-size:110px;line-height:0.98;letter-spacing:-0.04em;text-align:center;color:var(--ink)}
  .close em{font-style:italic;font-weight:800;color:var(--terra)}
  .close-sub{margin-top:34px;font-size:40px;color:var(--ink-dim);text-align:center;font-weight:500}
  .close-cta{margin-top:58px;display:inline-block;padding:26px 54px;border:2px solid var(--terra);border-radius:16px;font-size:24px;letter-spacing:0.16em;text-transform:uppercase;color:var(--terra-2);font-weight:700}
  .close-handle{margin-top:40px;text-align:center;font-size:22px;letter-spacing:0.5em;color:var(--ink-faint);text-transform:uppercase;font-weight:700}

  .ink-wipe{position:absolute;inset:0;background:var(--terra);z-index:80;transform:translateX(-100%)}
  .ink-wipe-2{background:var(--ink)}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920">
  <div class="paper" id="paper"></div>
  <div class="particles" id="particles"></div>

  <div id="s1" class="scene">
    <div>
      <div class="s1-stat">90</div>
      <div class="s1-unit">dias de Premium</div>
      <div class="s1-hook"><em>incluídos</em></div>
    </div>
  </div>
  <div id="s2" class="scene">
    <div>
      <div class="s2-header">Tudo Premium</div>
      <div class="s2-list">
        <div class="s2-item" id="s2-c1">planos <em>personalizados</em></div>
        <div class="s2-item" id="s2-c2">dezenas de <em>programas</em></div>
        <div class="s2-item" id="s2-c3">treinos novos <em>todas as semanas</em></div>
      </div>
    </div>
  </div>
  <div id="s3" class="scene">
    <div class="phone">
      <div class="video-call">
        <div class="avatar-circle">👋</div>
        <div class="call-buttons">
          <div class="call-btn"></div>
          <div class="call-btn active"></div>
        </div>
      </div>
    </div>
    <div class="phone-cap">boas-vindas por <em>videochamada</em></div>
  </div>
  <div id="s4" class="scene">
    <div>
      <div class="stmt">é assim que se começa<br>no <em>TechBody U</em></div>
      <div class="stmt-rule"></div>
    </div>
  </div>
  <div id="s5" class="scene">
    <div>
      <div class="close">saiba tudo no <em>site</em></div>
      <div class="close-sub">Premium incluso</div>
      <div class="close-cta">link na bio</div>
      <div class="close-handle">@techbody_u</div>
    </div>
  </div>

  <div class="ink-wipe" id="w1"></div><div class="ink-wipe ink-wipe-2" id="w2"></div><div class="ink-wipe" id="w3"></div><div class="ink-wipe ink-wipe-2" id="w4"></div>

  <div class="vignette"></div>
  <div class="grain"></div>

  <audio id="narr" src="audio/narration.mp3" data-start="0" data-duration="21.97" data-track-index="9" data-volume="1"></audio>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({paused:true});
    const S = [0.3, 4.52, 8.57, 13.56, 16.76];
    const TOTAL = 21.97;
    function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    const rand = rng(211);
    function wipeIn(el,fromX,toX,t,prev,next){tl.fromTo(el,{x:fromX},{x:'0%',duration:0.4,ease:'expo.in'},t-0.4);tl.set(prev,{opacity:0},t-0.05);tl.set(next,{opacity:1},t-0.05);tl.to(el,{x:toX,duration:0.4,ease:'expo.out',overwrite:'auto'},t);}

    // ===== AMBIENTE =====
    const reps=(start,cyc)=>Math.max(0,Math.floor((TOTAL-start)/cyc)-1);
    tl.to('#paper',{xPercent:3,yPercent:-2,duration:6,ease:'sine.inOut',yoyo:true,repeat:reps(0,6),overwrite:'auto'},0);
    const pf=document.getElementById('particles');
    for(let i=0;i<14;i++){const d=document.createElement('div');d.className='pt';const x=Math.round(rand()*1080),sz=5+Math.round(rand()*6),cyc=6+rand()*4,start=+(rand()*3).toFixed(2);d.style.left=x+'px';d.style.width=sz+'px';d.style.height=sz+'px';pf.appendChild(d);tl.fromTo(d,{y:1980,opacity:0},{y:-60,opacity:0.4,duration:cyc,ease:'none',repeat:reps(start,cyc)},start);}
    tl.set('#paper',{opacity:1},TOTAL);

    // ===== CENAS =====
    tl.to('#s1',{opacity:1,duration:0.01},S[0]);
    tl.from('#s1 .s1-stat',{y:60,opacity:0,duration:0.8,ease:'expo.out'},S[0]+0.05);
    tl.from('#s1 .s1-unit',{y:30,opacity:0,duration:0.6,ease:'expo.out'},S[0]+0.55);
    tl.from('#s1 .s1-hook',{y:40,opacity:0,duration:0.8,ease:'expo.out'},S[0]+0.95);
    tl.from('#s1 .s1-hook em',{scale:1.14,duration:0.8,ease:'power3.out'},S[0]+1.35);
    wipeIn('#w1','-100%','100%',S[1],'#s1','#s2');

    tl.from('#s2 .s2-header',{y:18,opacity:0,duration:0.5},S[1]+0.1);
    tl.from('#s2-c1',{x:-50,opacity:0,duration:0.55,ease:'expo.out'},S[1]+0.40);
    tl.from('#s2-c2',{x:-50,opacity:0,duration:0.55,ease:'expo.out'},S[1]+0.75);
    tl.from('#s2-c3',{x:-50,opacity:0,duration:0.55,ease:'expo.out'},S[1]+1.10);
    wipeIn('#w2','100%','-100%',S[2],'#s2','#s3');

    tl.from('#s3 .phone',{y:60,opacity:0,scale:0.93,duration:0.9,ease:'expo.out'},S[2]+0.1);
    tl.from('#s3 .avatar-circle',{scale:0.5,opacity:0,duration:0.8,ease:'expo.out'},S[2]+0.55);
    tl.to('#s3 .avatar-circle',{scale:1.08,duration:0.8,ease:'sine.inOut',yoyo:true,repeat:2,overwrite:'auto'},S[2]+1.35);
    tl.from('#s3 .call-buttons',{y:20,opacity:0,duration:0.6},S[2]+1.6);
    tl.from('#s3 .phone-cap',{y:24,opacity:0,duration:0.7,ease:'expo.out'},S[2]+2.0);
    tl.from('#s3 .phone-cap em',{scale:1.12,duration:0.7,ease:'power3.out'},S[2]+2.4);
    wipeIn('#w3','-100%','100%',S[3],'#s3','#s4');

    tl.from('#s4 .stmt',{scale:0.6,opacity:0,duration:0.9,ease:'expo.out'},S[3]+0.1);
    tl.to('#s4 .stmt',{scale:1.02,duration:1.3,ease:'sine.inOut',yoyo:true,repeat:1,overwrite:'auto'},S[3]+1.2);
    tl.from('#s4 .stmt-rule',{scaleX:0,duration:0.6,ease:'power2.out'},S[3]+1.0);
    wipeIn('#w4','100%','-100%',S[4],'#s4','#s5');

    tl.from('#s5 .close',{y:50,opacity:0,duration:0.8,ease:'expo.out'},S[4]+0.1);
    tl.from('#s5 .close em',{scale:1.12,duration:0.8,ease:'power3.out'},S[4]+0.5);
    tl.from('#s5 .close-sub',{y:16,opacity:0,duration:0.6},S[4]+1.0);
    tl.from('#s5 .close-cta',{scale:0.8,opacity:0,duration:0.6,ease:'back.out(2)'},S[4]+1.5);
    tl.to('#s5 .close-cta',{scale:1.06,duration:0.7,ease:'sine.inOut',yoyo:true,repeat:2,overwrite:'auto'},S[4]+2.3);
    tl.from('#s5 .close-handle',{y:14,opacity:0,duration:0.6},S[4]+1.9);
    tl.to('#s5',{opacity:0,duration:0.5,ease:'power2.in'},TOTAL-0.5);

    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
