<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TechBody U · comprar_com_confianca</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,200;0,400;0,700;0,800;1,200;1,400;1,800&family=Manrope:wght@200;400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #F2EDE4;
  --primary: #14160F;
  --accent: #C36F49;
  --text: #14160F;
  --text-mute: rgba(20, 22, 15, 0.55);
  --text-faint: rgba(20, 22, 15, 0.35);
  --line: rgba(20, 22, 15, 0.12);
  --font-display: 'Fraunces', serif;
  --font-body: 'Manrope', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
/* Carousel slides at Instagram portrait 4:5 (1080×1350). Iframe parent é 4:5. */
.carousel {
  display: flex;
  scroll-snap-type: x mandatory;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
  height: 100vh;
  width: 100vw;
}
.carousel::-webkit-scrollbar { display: none; }
.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: clamp(40px, 6vw, 72px);
  background: var(--bg);
  color: var(--text);
}
.slide__top {
  display: flex; justify-content: space-between; align-items: baseline;
  font: 500 12px/1 var(--font-body);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-mute);
}
.slide__top .brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  font-size: clamp(14px, 2.4vw, 26px);
  letter-spacing: -0.02em;
  color: var(--accent);
  text-transform: none;
}
.slide__bottom {
  display: flex; justify-content: space-between; align-items: baseline;
  font: 500 12px/1 var(--font-body);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-mute);
}
.slide__cta {
  background: var(--accent);
  color: var(--bg);
  padding: 10px 22px;
  font: 700 13px/1 var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.slide__body { display: grid; align-content: center; }

/* ─── style: photo (split 2-col layout) ─── */
.slide--photo .slide__body {
  grid-template-columns: 1fr 1fr;
  gap: clamp(28px, 4vw, 56px);
  align-items: center;
}
.slide--photo h1 {
  font: 200 clamp(40px, 6vw, 92px)/0.94 var(--font-display);
  font-style: italic;
  letter-spacing: -0.025em;
  color: var(--text);
}
.slide--photo h1 em {
  color: var(--accent);
  font-style: italic;
  font-weight: 800;
}
.slide--photo .photo {
  aspect-ratio: 4/5;
  background-size: cover;
  background-position: center;
  border-radius: 2px;
}
/* When the hook line is short, allow a more poetic mix-case heading. */

/* ─── style: typographic (centered serif) ─── */
.slide--type .slide__body {
  align-content: center;
  justify-items: center;
  text-align: center;
}
.slide--type h1 {
  font: 200 clamp(40px, 7vw, 108px)/0.96 var(--font-display);
  font-style: italic;
  letter-spacing: -0.025em;
  max-width: 14ch;
  color: var(--text);
}
.slide--type h1 em { color: var(--accent); font-weight: 800; }

/* ─── style: numeric (large terracotta number) ─── */
.slide--num .slide__body {
  align-content: center;
  gap: 18px;
}
.slide--num .num {
  font: 800 clamp(120px, 22vw, 280px)/0.84 var(--font-display);
  font-style: italic;
  letter-spacing: -0.06em;
  color: var(--accent);
}
.slide--num h1 {
  font: 400 clamp(28px, 3.6vw, 48px)/1.1 var(--font-display);
  font-style: italic;
  letter-spacing: -0.02em;
  max-width: 22ch;
  color: var(--text);
}

/* ─── style: quote (italic blockquote) ─── */
.slide--quote .slide__body {
  align-content: center;
  gap: 16px;
  border-left: 3px solid var(--accent);
  padding-left: clamp(20px, 3vw, 36px);
}
.slide--quote blockquote {
  font: 200 clamp(28px, 4.4vw, 56px)/1.18 var(--font-display);
  font-style: italic;
  letter-spacing: -0.02em;
  color: var(--text);
  max-width: 22ch;
}
.slide--quote cite {
  font: 500 12px/1 var(--font-body);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-mute);
  font-style: normal;
}
</style>
<!-- fx-loops -->
<style id="fx-loops">
/* ═══ FX loops — decorativos animados, texto estático (legível sempre) ═══ */
:root { --fxc: infinite; } /* render substitui por contagem finita */

.fx-orb {
  position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%;
  top: -12%; right: -14%; z-index: 0; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent), transparent 66%);
  filter: blur(36px);
  animation: fx-drift 12s ease-in-out var(--fxc);
}
@keyframes fx-drift {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: .75; }
  50%      { transform: translate(-9%, 10%) scale(1.18); opacity: 1; }
}

.slide__photo, .bg-photo, .slide--photo .photo {
  animation: fx-kenburns 12s ease-in-out var(--fxc);
  will-change: transform;
}
@keyframes fx-kenburns { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.num { animation: fx-float 6s ease-in-out var(--fxc); }
@keyframes fx-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

h1 em, blockquote em { animation: fx-em 4s ease-in-out var(--fxc); }
@keyframes fx-em { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

.arrow, .slide__cta, .story-single__cta { animation: fx-nudge 2s ease-in-out var(--fxc); display: inline-block; }
@keyframes fx-nudge { 0%, 100% { transform: translateX(0); } 60% { transform: translateX(7px); } }

/* ─ slide 1: assinatura ─ */
.carousel .slide:first-child .slide__body::after {
  content: ""; display: block; height: 5px; width: 36%;
  margin-top: clamp(14px, 2vw, 26px);
  background: var(--accent); transform-origin: center;
  animation: fx-sweep 6s cubic-bezier(.65, 0, .25, 1) var(--fxc);
}
@keyframes fx-sweep { 0%, 100% { transform: scaleX(.14); opacity: .6; } 50% { transform: scaleX(1); opacity: 1; } }
.carousel .slide:first-child .fx-orb { width: 80%; top: -18%; right: -20%; }

/* ─ stories: texto centrado ─ */
.story-single__body {
  justify-items: center !important; align-content: center !important;
  text-align: center !important; justify-self: stretch !important;
}
.story-single__body h1, .story-single__body .num, .story-single__body p { margin-inline: auto; }
.story-single--quote .story-single__body { border-left: none !important; padding-left: 0 !important; }

@media (prefers-reduced-motion: reduce) {
  .fx-orb, .slide__photo, .bg-photo, .slide--photo .photo, .num,
  h1 em, blockquote em, .arrow, .slide__cta, .story-single__cta { animation: none !important; }
  .carousel .slide:first-child .slide__body::after { animation: none !important; }
}
</style>

</head>

<script>
  (function () {
    var carousel = document.querySelector('.carousel');
    function go() {
      var m = (location.hash || '').match(/^#slide-(\d+)$/);
      if (!m || !carousel) return;
      var el = document.getElementById('slide-' + m[1]);
      if (!el) return;
      var prev = carousel.style.scrollSnapType;
      carousel.style.scrollSnapType = 'none';
      carousel.scrollLeft = el.offsetLeft;
      requestAnimationFrame(function () {
        carousel.style.scrollSnapType = prev || '';
      });
    }
    window.addEventListener('hashchange', go);
    if (document.readyState === 'complete') go();
    else window.addEventListener('load', go);
  })();
</script>
