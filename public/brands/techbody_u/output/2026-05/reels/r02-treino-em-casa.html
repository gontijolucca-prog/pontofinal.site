<!doctype html>
<html lang="pt-PT"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quatro metros quadrados.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,200;0,400;0,800;1,200;1,400;1,800&family=Manrope:wght@200;400;500;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
<style>

:root {
  --bg: #F2EDE4;
  --accent: #C36F49;
  --text: #14160F;
  --mute: color-mix(in srgb, var(--text) 55%, transparent);
  --line: color-mix(in srgb, var(--text) 12%, transparent);
  --font-display: 'Fraunces', serif;
  --font-body: 'Manrope', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #050507;
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.reel {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-height: 100vh;
  aspect-ratio: 9 / 16;
  margin: 0 auto;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
.reel__brand {
  position: absolute; top: clamp(20px, 3.4vw, 38px);
  left: clamp(20px, 3.4vw, 38px);
  z-index: 10;
  font-family: var(--font-display);
  font-weight: 200;
  font-style: italic;
  font-size: clamp(18px, 2.2vw, 26px);
  letter-spacing: -0.015em;
  color: var(--accent);
}
.reel__progress {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: rgba(255,255,255,0.06);
  z-index: 11;
}
.reel__progress::before {
  content: ""; position: absolute; inset: 0;
  background: var(--accent);
  transform-origin: left center;
  animation: reel-progress 15s linear infinite;
}
@keyframes reel-progress {
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}


.stage {
  position: absolute; inset: 0;
  display: grid; gap: clamp(18px, 3vw, 28px);
  padding: 120px 48px 80px;
  grid-template-rows: auto 1fr auto auto auto;
  align-content: start;
}
.label {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--mute);
}
.space {
  position: relative; width: 100%; aspect-ratio: 1/1; max-height: 38vh;
  margin: 0 auto;
}
.space__box {
  position: absolute; inset: 14%;
  border: 2px dashed var(--accent);
  animation: boxgrow 15s ease infinite;
  transform-origin: center;
}
@keyframes boxgrow {
  0% { transform: scale(0); opacity: 0; }
  18% { transform: scale(1); opacity: 1; }
  90% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.space__rule {
  position: absolute;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent); letter-spacing: 0.18em;
  opacity: 0;
  animation: rfade 15s ease infinite;
}
.space__rule--x { top: 6%; left: 50%; transform: translateX(-50%); animation-delay: 1.5s; }
.space__rule--y { left: 4%; top: 50%; transform: translateY(-50%) rotate(-90deg); animation-delay: 1.8s; }
@keyframes rfade { 0% { opacity: 0; } 18% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
.space__num {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--font-display); font-style: italic; font-weight: 800;
  font-size: clamp(60px, 12vw, 130px);
  color: var(--accent); letter-spacing: -0.05em;
  opacity: 0;
  animation: numfade 15s ease infinite;
  animation-delay: 3s;
}
@keyframes numfade { 0% { opacity: 0; transform: scale(0.8); } 8% { opacity: 1; transform: scale(1); } 60% { opacity: 1; transform: scale(1); } 75% { opacity: 0; transform: scale(0.95); } 100% { opacity: 0; } }
.space__icon {
  position: absolute;
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(40px, 6vw, 56px); color: var(--text);
  opacity: 0;
}
.i1 { top: 28%; left: 28%; animation: ico 15s ease infinite; animation-delay: 7.5s; }
.i2 { top: 28%; right: 28%; animation: ico 15s ease infinite; animation-delay: 8.5s; }
.i3 { bottom: 28%; left: 50%; transform: translateX(-50%); animation: ico 15s ease infinite; animation-delay: 9.5s; }
@keyframes ico { 0% { opacity: 0; transform: translateY(6px); } 8% { opacity: 1; transform: translateY(0); } 35% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
.kicker {
  font-family: var(--font-display); font-style: italic;
  font-weight: 200; font-size: clamp(28px, 4.4vw, 44px);
  letter-spacing: -0.022em; line-height: 1.05;
  max-width: 16ch; opacity: 0;
  animation: kfade 15s ease infinite;
  animation-delay: 11s;
}
.kicker em { font-weight: 800; font-style: italic; color: var(--accent); }
@keyframes kfade { 0% { opacity: 0; } 8% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
.caption {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(14px, 1.6vw, 18px); color: var(--mute);
  max-width: 28ch; opacity: 0;
  animation: kfade 15s ease infinite;
  animation-delay: 11.6s;
}
.cta {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--mute); padding-top: 12px;
  border-top: 1px solid var(--line);
  text-align: center;
}

</style></head>
<body>
<section class="reel" aria-label="Reel TechBody U — Quatro metros quadrados.">
  <div class="reel__progress"></div>
  <span class="reel__brand">TechBody U</span>

<div class="stage">
  <span class="label">O TEU ESTÚDIO</span>
  <div class="space">
    <div class="space__box"></div>
    <div class="space__rule space__rule--x"><span>2 m</span></div>
    <div class="space__rule space__rule--y"><span>2 m</span></div>
    <span class="space__num">4 m²</span>
    <span class="space__icon i1">↑</span>
    <span class="space__icon i2">↺</span>
    <span class="space__icon i3">⟂</span>
  </div>
  <h2 class="kicker"><em>Quatro metros quadrados.</em> É tudo o que precisas.</h2>
  <p class="caption">Vestes o fato, abres a aplicação e treinas em vinte minutos.</p>
  <span class="cta">Marca uma demonstração →</span>
</div>

</section>
</body></html>
