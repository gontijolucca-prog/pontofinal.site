<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Eletroestimulação, em conversa.</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; color: #fff; }
  .reel { position: relative; width: 100%; height: 100%; }
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .voice-badge {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.6);
    padding: 6px 10px;
    font: 700 9px/1 'JetBrains Mono', monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    z-index: 5;
  }
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 14px 16px 18px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 60%, transparent);
    display: flex; align-items: center; gap: 12px;
    z-index: 6;
  }
  .play {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #FF2A2A;
    color: #fff;
    border: 0;
    cursor: pointer;
    font: 900 16px/1 sans-serif;
    display: grid; place-items: center;
  }
  .progress {
    flex: 1; height: 4px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
  }
  .progress__fill {
    height: 100%;
    background: #FF2A2A;
    width: 0%;
    transition: width 80ms linear;
  }
  .time {
    font-size: 10px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.06em;
    min-width: 56px;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="reel">
    <video id="video" src="r03-app-acompanhamento.mp4" muted loop playsinline preload="auto"></video>
    <span class="voice-badge">Voz dupla · Joana + Tugão</span>
    <div class="controls">
      <button id="play" class="play" aria-label="Play">▶</button>
      <div class="progress"><div class="progress__fill" id="fill"></div></div>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
  </div>
  <audio id="audio" src="r03-dialogo-ems.voice.mp3" preload="auto"></audio>
  <script>
    const video = document.getElementById('video');
    const audio = document.getElementById('audio');
    const play  = document.getElementById('play');
    const fill  = document.getElementById('fill');
    const time  = document.getElementById('time');

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s/60), x = Math.floor(s%60);
      return m + ':' + String(x).padStart(2,'0');
    }

    play.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        video.play();
        play.textContent = '⏸';
      } else {
        audio.pause();
        video.pause();
        play.textContent = '▶';
      }
    });

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      audio.play();
      video.currentTime = 0;
      video.play();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    });
    audio.addEventListener('loadedmetadata', () => {
      time.textContent = '0:00 / ' + fmt(audio.duration);
    });
  </script>
</body>
</html>
